<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".14"/></filter></defs>
<rect width="1600" height="1000" fill="url(#g)"/><rect x="24" y="24" width="1552" height="952" rx="24" fill="#fff" stroke="#ddd6fe" stroke-width="3"/>
<rect x="45" y="45" width="180" height="92" rx="12" fill="#35169b"/><text x="135" y="105" fill="white" text-anchor="middle" font-family="Arial" font-size="40" font-weight="700">04.02.01</text>
<text x="260" y="88" font-family="Arial" font-size="44" font-weight="700" fill="#11133d">Amazon EventBridge</text><text x="260" y="122" font-family="Arial" font-size="22" fill="#4c35b8" font-weight="700">Connect events. Route intelligently. Automate at scale.</text>
<g filter="url(#s)"><rect x="1040" y="48" width="230" height="100" rx="16" fill="#26136d"/><text x="1155" y="84" fill="white" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">SERVICE AT A GLANCE</text><text x="1155" y="116" fill="#c4b5fd" text-anchor="middle" font-family="Arial" font-size="17">Serverless event bus</text><rect x="1285" y="48" width="265" height="100" rx="16" fill="#ecfdf5" stroke="#86efac"/><text x="1418" y="82" fill="#166534" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">KEY BENEFITS</text><text x="1310" y="112" fill="#166534" font-family="Arial" font-size="15">✓ loose coupling  ✓ replay</text><text x="1310" y="134" fill="#166534" font-family="Arial" font-size="15">✓ filtering  ✓ cross-account</text></g>
<g font-family="Arial" fill="#11133d"><rect x="45" y="170" width="360" height="330" rx="14" fill="#fafafa" stroke="#c4b5fd"/><text x="70" y="205" fill="#35169b" font-size="20" font-weight="700">1. WHAT IS EVENTBRIDGE?</text><text x="70" y="245" font-size="18">• A managed event bus for AWS,</text><text x="70" y="273" font-size="18">  SaaS, and custom applications.</text><text x="70" y="315" font-size="18">• Matches events to rules and</text><text x="70" y="343" font-size="18">  sends them to targets.</text><rect x="70" y="380" width="300" height="88" rx="12" fill="#ecfdf5"/><text x="90" y="412" fill="#166534" font-size="18" font-weight="700">BEST FOR</text><text x="90" y="440" fill="#166534" font-size="16">Decoupled automation &amp; integration</text></g>
<g font-family="Arial"><rect x="430" y="170" width="710" height="330" rx="14" fill="#fff" stroke="#c4b5fd"/><text x="460" y="205" fill="#35169b" font-size="20" font-weight="700">2. HOW IT WORKS — EVENT ROUTING PIPELINE</text><g stroke="#6d28d9" stroke-width="5" fill="none"><path d="M560 330h120"/><path d="M800 330h120"/><path d="M1040 330h55"/></g><g fill="#fff" stroke="#7c3aed" stroke-width="3"><circle cx="510" cy="330" r="52"/><rect x="680" y="270" width="120" height="120" rx="18"/><rect x="920" y="270" width="120" height="120" rx="18"/><rect x="1095" y="270" width="30" height="120" rx="12" fill="#f0abfc"/></g><g fill="#35169b" font-family="Arial" text-anchor="middle" font-size="17" font-weight="700"><text x="510" y="325">EVENT</text><text x="510" y="348">SOURCE</text><text x="740" y="322">EVENT</text><text x="740" y="346">BUS</text><text x="980" y="322">RULE</text><text x="980" y="346">MATCH</text><text x="1120" y="430">TARGETS</text></g><text x="470" y="455" fill="#4c35b8" font-size="17">Pattern filters → transform (optional) → invoke target</text></g>
<g font-family="Arial"><rect x="1165" y="170" width="385" height="330" rx="14" fill="#fafafa" stroke="#c4b5fd"/><text x="1190" y="205" fill="#35169b" font-size="20" font-weight="700">3. CORE BUILDING BLOCKS</text><text x="1190" y="250" font-size="18">◈ Event buses</text><text x="1190" y="285" font-size="18">◇ Rules &amp; event patterns</text><text x="1190" y="320" font-size="18">▣ Targets &amp; retries</text><text x="1190" y="355" font-size="18">↻ Archives &amp; replay</text><text x="1190" y="390" font-size="18">⇄ Pipes &amp; Scheduler</text><text x="1190" y="450" fill="#166534" font-size="16">IAM controls every route</text></g>
<g font-family="Arial"><rect x="45" y="530" width="720" height="300" rx="14" fill="#fff" stroke="#c4b5fd"/><text x="70" y="565" fill="#35169b" font-size="20" font-weight="700">4. COMMON SOURCES → TARGETS</text><g font-size="17" fill="#11133d"><text x="80" y="615">AWS services  →  Lambda, Step Functions</text><text x="80" y="655">SaaS apps      →  SQS, SNS, Kinesis</text><text x="80" y="695">Custom apps    →  API destinations</text><text x="80" y="735">Scheduled time  →  ECS tasks, Batch jobs</text><text x="80" y="785" fill="#166534" font-weight="700">One event can fan out to many actions.</text></g></g>
<g font-family="Arial"><rect x="790" y="530" width="760" height="300" rx="14" fill="#fff" stroke="#c4b5fd"/><text x="815" y="565" fill="#35169b" font-size="20" font-weight="700">5. EL10 TAKEAWAY &amp; BEST PRACTICES</text><text x="815" y="615" font-size="17">✓ Use precise event patterns to reduce noise</text><text x="815" y="650" font-size="17">✓ Design retries, DLQs, and idempotent targets</text><text x="815" y="685" font-size="17">✓ Archive important events for replay</text><text x="815" y="720" font-size="17">✓ Use least-privilege IAM and cross-account policies</text><rect x="815" y="750" width="680" height="52" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="1155" y="783" text-anchor="middle" fill="#9a3412" font-size="18" font-weight="700">Event-driven architecture = faster change with fewer dependencies</text></g>
<text x="800" y="925" text-anchor="middle" font-family="Arial" font-size="24" fill="#35169b" font-weight="700">Sources → Bus → Rules → Targets → Observe &amp; replay</text>
</svg>
