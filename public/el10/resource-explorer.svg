<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eff6ff"/></linearGradient></defs><rect width="1600" height="1000" fill="url(#b)"/><rect x="24" y="24" width="1552" height="952" rx="24" fill="white" stroke="#bfdbfe" stroke-width="3"/><rect x="45" y="45" width="180" height="92" rx="12" fill="#123b9b"/><text x="135" y="105" fill="white" text-anchor="middle" font-family="Arial" font-size="40" font-weight="700">03.01.20</text><text x="260" y="88" font-family="Arial" font-size="44" font-weight="700" fill="#101b4d">AWS Resource Explorer</text><text x="260" y="122" font-family="Arial" font-size="22" fill="#1553b3" font-weight="700">Find AWS resources quickly across Regions and accounts.</text><rect x="1150" y="48" width="380" height="100" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="1340" y="84" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#1e40af">EL10 TAKEAWAY</text><text x="1340" y="116" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">Search → discover → act</text><g font-family="Arial"><rect x="45" y="170" width="430" height="330" rx="14" fill="#fff" stroke="#93c5fd"/><text x="70" y="205" fill="#123b9b" font-size="20" font-weight="700">1. WHY RESOURCE EXPLORER?</text><text x="70" y="250" font-size="18">• Unified inventory search</text><text x="70" y="290" font-size="18">• Works across supported AWS services</text><text x="70" y="330" font-size="18">• Filter by type, tag, name, Region</text><rect x="70" y="380" width="360" height="88" rx="12" fill="#ecfdf5"/><text x="90" y="412" fill="#166534" font-size="18" font-weight="700">BEST FOR</text><text x="90" y="440" fill="#166534" font-size="16">Discovery, inventory, and operations</text></g><g font-family="Arial"><rect x="500" y="170" width="660" height="330" rx="14" fill="#fff" stroke="#93c5fd"/><text x="530" y="205" fill="#123b9b" font-size="20" font-weight="700">2. SEARCH ARCHITECTURE</text><g stroke="#2563eb" stroke-width="5" fill="none"><path d="M620 335h110"/><path d="M850 335h100"/><path d="M1070 335h55"/></g><g fill="#fff" stroke="#2563eb" stroke-width="3"><rect x="540" y="280" width="80" height="110" rx="16"/><circle cx="790" cy="335" r="55"/><rect x="950" y="280" width="120" height="110" rx="16"/><rect x="1125" y="280" width="25" height="110" rx="10" fill="#60a5fa"/></g><g text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#123b9b"><text x="580" y="325">AWS</text><text x="580" y="350">RESOURCES</text><text x="790" y="340">INDEX</text><text x="1010" y="325">QUERY</text><text x="1010" y="350">FILTERS</text><text x="1138" y="430">RESULTS</text></g><text x="530" y="455" fill="#1553b3" font-size="17">Regional indexes + aggregator Region for multi-Region visibility</text></g><g font-family="Arial"><rect x="1190" y="170" width="360" height="330" rx="14" fill="#fff" stroke="#93c5fd"/><text x="1215" y="205" fill="#123b9b" font-size="20" font-weight="700">3. ACCESS PATHS</text><text x="1215" y="255" font-size="18">⌘ Console</text><text x="1215" y="295" font-size="18">&gt; CLI / SDK / API</text><text x="1215" y="335" font-size="18">⚿ IAM permissions</text><text x="1215" y="375" font-size="18">⌗ Resource Explorer view</text><text x="1215" y="445" fill="#166534" font-size="16">Govern with Organizations</text></g><g font-family="Arial"><rect x="45" y="530" width="740" height="300" rx="14" fill="#fff" stroke="#93c5fd"/><text x="70" y="565" fill="#123b9b" font-size="20" font-weight="700">4. PRACTICAL QUERY FLOW</text><text x="80" y="620" font-size="18">1  Pick a view and Region scope</text><text x="80" y="660" font-size="18">2  Search: service:type, tag, name, or ARN</text><text x="80" y="700" font-size="18">3  Inspect results and open the owning console</text><text x="80" y="740" font-size="18">4  Export or hand off to automation</text><text x="80" y="790" fill="#166534" font-weight="700" font-size="17">Great for incident response and cleanup.</text></g><g font-family="Arial"><rect x="810" y="530" width="740" height="300" rx="14" fill="#fff" stroke="#93c5fd"/><text x="835" y="565" fill="#123b9b" font-size="20" font-weight="700">5. BENEFITS, LIMITS &amp; RELATED SERVICES</text><text x="835" y="615" font-size="17">✓ Faster resource discovery and ownership checks</text><text x="835" y="650" font-size="17">✓ Multi-account visibility with Organizations</text><text x="835" y="685" font-size="17">✓ Complements Config, CloudTrail, and Tag Editor</text><text x="835" y="720" font-size="17">⚠ Coverage depends on supported resource types/Regions</text><rect x="835" y="750" width="680" height="52" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="1175" y="783" text-anchor="middle" fill="#1e40af" font-size="18" font-weight="700">Inventory first. Then govern, secure, and optimize.</text></g><text x="800" y="925" text-anchor="middle" font-family="Arial" font-size="24" fill="#123b9b" font-weight="700">Searchable inventory = visibility across the AWS estate</text></svg>
