ial,sans-serif" font-size="18" fill="#087db4" font-weight="700">Edited</text><text x="67" y="265" font-family="Arial,sans-serif" font-size="19" fill="#1b2633" font-weight="700">Network</text><rect x="67" y="278" width="774" height="48" rx="8" fill="#fff" stroke="#8797a7" stroke-width="1"/><text x="84" y="308" font-family="Arial,sans-serif" font-size="19" fill="#516474" font-weight="400">Approved lab VPC</text><text x="809" y="309" font-family="Arial,sans-serif" font-size="23" fill="#087db4" font-weight="700">⌄</text><text x="67" y="373" font-family="Arial,sans-serif" font-size="19" fill="#1b2633" font-weight="700">Subnet</text><rect x="67" y="388" width="774" height="48" rx="8" fill="#fff" stroke="#8797a7" stroke-width="1"/><text x="84" y="418" font-family="Arial,sans-serif" font-size="19" fill="#516474" font-weight="400">Public subnet (route to internet gateway)</text><text x="809" y="419" font-family="Arial,sans-serif" font-size="23" fill="#087db4" font-weight="700">⌄</text><text x="67" y="481" font-family="Arial,sans-serif" font-size="19" fill="#1b2633" font-weight="700">Auto-assign public IP</text><rect x="67" y="496" width="774" height="48" rx="8" fill="#fff" stroke="#8797a7" stroke-width="1"/><text x="84" y="526" font-family="Arial,sans-serif" font-size="19" fill="#516474" font-weight="400">Enable</text><text x="809" y="527" font-family="Arial,sans-serif" font-size="23" fill="#087db4" font-weight="700">⌄</text><text x="67" y="601" font-family="Arial,sans-serif" font-size="21" fill="#1b2633" font-weight="700">Firewall (security groups)</text><text x="67" y="637" font-family="Arial,sans-serif" font-size="17" fill="#516474" font-weight="400">A security group controls inbound and outbound traffic to the instance.</text><rect x="67" y="658" width="452" height="54" rx="9" fill="#f0f8ff" stroke="#087db4" stroke-width="2"/><text x="86" y="692" font-family="Arial,sans-serif" font-size="19" fill="#1b2633" font-weight="400">◉  Create security group</text><rect x="538" y=