<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1006" viewBox="0 0 1920 1006"><rect x="0" y="0" width="1920" height="1006" rx="0" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="1"/><text x="36" y="59" font-family="Arial,sans-serif" font-size="35" fill="#1b2633" font-weight="700">Launch an instance</text><text x="520" y="56" font-family="Arial,sans-serif" font-size="17" fill="#087db4" font-weight="700">Info</text><text x="36" y="95" font-family="Arial,sans-serif" font-size="20" fill="#516474" font-weight="400">Amazon EC2 allows you to create virtual machines, or instances, that run on the AWS Cloud.</text><rect x="1294" y="20" width="590" height="971" rx="22" fill="#fff" stroke="#c9d4dd" stroke-width="1"/><text x="1325" y="72" font-family="Arial,sans-serif" font-size="29" fill="#1b2633" font-weight="700">▾  Summary</text><text x="1325" y="119" font-family="Arial,sans-serif" font-size="19" fill="#1b2633" font-weight="700">Number of instances</text><text x="1559" y="119" font-family="Arial,sans-serif" font-size="16" fill="#087db4" font-weight="700">Info</text><rect x="1325" y="135" width="528" height="47" rx="8" fill="#fff" stroke="#8797a7" stroke-width="1"/><text x="1342" y="165" font-family="Arial,sans-serif" font-size="19" fill="#516474" font-weight="400">1</text><text x="1325" y="239" font-family="Arial,sans-serif" font-size="19" fill="#087db4" font-weight="700">Software Image (AMI)</text><text x="1325" y="271" font-family="Arial,sans-serif" font-size="19" fill="#516474" font-weight="400">Amazon Linux 2023 AMI</text><text x="1325" y="343" font-family="Arial,sans-serif" font-size="19" fill="#087db4" font-weight="700">Virtual server type (instance type)</text><text x="1325" y="374" font-family="Arial,sans-serif" font-size="19" fill="#516474" font-weight="400">t3.micro</text><text x="1325" y="445" font-family="Arial,sans-serif" font-size="19" fill="#087db4" font-weight="700">Firewall (security group)</text><text x="1325" y="476" font-family="Arial,sans-ser