dth="850" height="70" rx="8" fill="#fff" stroke="#8797a7" stroke-width="1"/><text x="84" y="292" font-family="Arial,sans-serif" font-size="19" fill="#516474" font-weight="400">t3.micro</text><text x="885" y="293" font-family="Arial,sans-serif" font-size="23" fill="#087db4" font-weight="700">⌄</text><text x="84" y="359" font-family="Arial,sans-serif" font-size="16" fill="#516474" font-weight="400">Family: t3     2 vCPU     1 GiB Memory</text><text x="961" y="302" font-family="Arial,sans-serif" font-size="19" fill="#087db4" font-weight="700">Compare instance types</text><text x="67" y="404" font-family="Arial,sans-serif" font-size="16" fill="#516474" font-weight="400">Current pricing and eligibility appear in the real console.</text><rect x="36" y="473" width="1222" height="258" rx="23" fill="#fff" stroke="#c9d4dd" stroke-width="1"/><text x="66" y="525" font-family="Arial,sans-serif" font-size="25" fill="#1b2633" font-weight="700">▾</text><text x="101" y="525" font-family="Arial,sans-serif" font-size="26" fill="#1b2633" font-weight="700">Key pair (login)</text><text x="402" y="524" font-family="Arial,sans-serif" font-size="16" fill="#087db4" font-weight="700">Info</text><text x="66" y="561" font-family="Arial,sans-serif" font-size="18" fill="#516474" font-weight="400">You can use a key pair to securely connect to your instance. Keep the downloaded private key safe.</text><text x="67" y="631" font-family="Arial,sans-serif" font-size="19" fill="#1b2633" font-weight="700">Key pair name - required</text><rect x="67" y="649" width="766" height="48" rx="8" fill="#fff" stroke="#8797a7" stroke-width="1"/><text x="84" y="679" font-family="Arial,sans-serif" font-size="19" fill="#516474" font-weight="400">lab-key</text><text x="801" y="680" font-family="Arial,sans-serif" font-size="23" fill="#087db4" font-weight="700">⌄</text><text x="866" y="679" font-family="Arial,sans-serif" font-size="19" fill="#087db4" font-weight="700">Create new key pair</text><rect x="36" y="759" width="