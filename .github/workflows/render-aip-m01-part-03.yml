name: Render AIP Module 01 Part 03 video

on:
  push:
    branches: [main]
    paths:
      - "content/video-narration/aip-module-01-part-03.json"
      - "scripts/render_aip_course_video.py"
      - "scripts/aip_tts_reliability.py"
      - "scripts/render_aip_course_video.py"
      - ".github/workflows/render-aip-m01-part-03.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aip-module-01-part-03-video
  cancel-in-progress: true

jobs:
  render:
    name: Render visual-verified RAG and Bedrock Knowledge Bases lecture
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "edge-tts>=7,<8" "Pillow>=10,<13" "requests>=2.31,<3"
          python -m py_compile scripts/render_aip_course_video.py

      - name: Restore successful neural narration chunks
        if: success()
        uses: actions/cache/restore@v4
        with:
          path: video-output/part-03/_work/audio
          key: aip-m01-p03-tts-${{ hashFiles('content/video-narration/aip-module-01-part-03.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aip-m01-p03-tts-${{ hashFiles('content/video-narration/aip-module-01-part-03.json') }}-

      - name: Render Module 01 Part 03 using original slides 14–24
        run: |
          python scripts/render_aip_course_video.py \
            --manifest content/video-narration/aip-module-01-part-03.json \
            --output video-output/part-03 --width 1920 --height 1080 --fps 24

      - name: Preserve completed speech chunks even if another TTS request fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: video-output/part-03/_work/audio
          key: aip-m01-p03-tts-${{ hashFiles('content/video-narration/aip-module-01-part-03.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate manifest and video
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("video-output/part-03/aip-module-01-part-03-manifest.json")
          m = json.loads(p.read_text())
          assert m["script_revision"] == "2026-11-11-m01-p03-visual-aligned-v1"
          assert [x["slide"] for x in m["scenes"]] == list(range(14, 25))
          assert m["duration_seconds"] > 600
          print(f"Validated {m['duration_seconds']} seconds and all 11 original slides")
          PY
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            video-output/part-03/aip-module-01-part-03.mp4

      - name: Archive video, WebVTT subtitles and transcript
        uses: actions/upload-artifact@v4
        with:
          name: aip-module-01-part-03-review-video
          path: |
            video-output/part-03/aip-module-01-part-03.mp4
            video-output/part-03/aip-module-01-part-03.vtt
            video-output/part-03/aip-module-01-part-03.srt
            video-output/part-03/aip-module-01-part-03-transcript.txt
            video-output/part-03/aip-module-01-part-03-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified preview to R2
        id: media
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "R2 credentials unavailable: review artifact still saved."
            exit 0
          fi
          PREFIX="aws-course-videos/previews/aip/module-01/part-03"
          FILE="aip-module-01-part-03"
          for ext in mp4 vtt srt txt json; do
            case "$ext" in
              mp4) src="video-output/part-03/$FILE.mp4"; mime="video/mp4"; suffix="$FILE.mp4";;
              vtt) src="video-output/part-03/$FILE.vtt"; mime="text/vtt"; suffix="$FILE.vtt";;
              srt) src="video-output/part-03/$FILE.srt"; mime="application/x-subrip"; suffix="$FILE.srt";;
              txt) src="video-output/part-03/$FILE-transcript.txt"; mime="text/plain"; suffix="$FILE-transcript.txt";;
              json) src="video-output/part-03/$FILE-manifest.json"; mime="application/json"; suffix="$FILE-manifest.json";;
            esac
            aws s3 cp "$src" "s3://$R2_BUCKET/$PREFIX/$suffix" \
              --endpoint-url "$R2_ENDPOINT" --content-type "$mime" \
              --cache-control "public,max-age=3600" --no-progress
          done
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Record verified R2 upload without Git rebase
        if: steps.media.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publish_aip_video_release.py \
            --manifest video-output/part-03/aip-module-01-part-03-manifest.json
