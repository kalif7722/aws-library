name: Prepare AIP Module 01 video slide review

on:
  push:
    branches: [main]
    paths:
      - "scripts/prepare_aip_video_review.py"
      - ".github/workflows/prepare-aip-m01-video-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aip-module-01-video-review
  cancel-in-progress: true

jobs:
  review:
    name: Inspect actual Module 01 slides without modifying main
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build slide inventory and visual contact sheets
        run: |
          python -m pip install "Pillow>=10,<13" "requests>=2.31,<3"
          python scripts/prepare_aip_video_review.py \
            --module 01 --part 01:1-9 --part 02:10-13 --part 03:14-24 --part 04:25-34 --part 05:35-43 --part 06:44-54 --part 07:55-59 \
            --out video-review/aip/module-01

      - name: Report each part's readiness without hiding missing source images
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("video-review/aip/module-01/inventory.json").read_text())
          lines = [
              "## AIP Module 01 — original slide review",
              "",
              "| Part | Expected slides | Valid images | Readiness |",
              "| --- | --- | --- | --- |",
          ]
          blocked = 0
          for part in report["parts"]:
              expected = part["range"][1] - part["range"][0] + 1
              valid = sum(bool(scene["available"]) for scene in part["slides"])
              ready = valid == expected
              blocked += not ready
              lines.append(
                  f"| {part['part']} | {expected} | {valid} | "
                  f"{'READY for visual script review' if ready else 'BLOCKED — source image missing'} |"
              )
          if report["missing"]:
              lines.extend(["", "### Source images requiring repair", ""])
              for item in report["missing"]:
                  lines.append(f"- Slide {item['slide']:02}: {item['error']}")
          lines.extend([
              "", f"**Blocked parts:** {blocked}. Review may succeed even if a source part needs repair.",
              "**Publishing rule:** A video renderer must still reject a missing original image.",
          ])
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(summary)
          PY

      - name: Save review-only artifact for inspection (never push generated images to main)
        uses: actions/upload-artifact@v4
        with:
          name: aip-module-01-source-slide-review
          path: video-review/aip/module-01/
          retention-days: 14
          if-no-files-found: error
