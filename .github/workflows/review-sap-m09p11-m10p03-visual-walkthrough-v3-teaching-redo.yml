name: SAP M09 P11–12 and M10 P01–03 visual walkthrough v3 teaching redo Andrew narration review
on:
  push:
    branches: [review/sap-m09p11-m10p03-visual-walkthrough-v3-teaching-redo]
    paths: [.github/workflows/review-sap-m09p11-m10p03-visual-walkthrough-v3-teaching-redo.yml, scripts/review_sap_m09p11_m10p03_visual_walkthrough_v3_teaching_redo.py, content/video-narration/review-sap-m09p11-m10p03-visual-walkthrough-v3-teaching-redo.json, content/video-narration/review-sap-m09p11-m10p03-visual-walkthrough-v3-teaching-redo.sha256]
permissions:
  contents: read
concurrency:
  group: sap-m09p11-m10p03-visual-walkthrough-v3-teaching-redo-review-only
  cancel-in-progress: false
jobs:
  voice:
    if: github.repository == 'kalif7722/aws-library' && github.event_name == 'push' && github.ref == 'refs/heads/review/sap-m09p11-m10p03-visual-walkthrough-v3-teaching-redo'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        part: [m09p11, m09p12, m10p01, m10p02, m10p03]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/review_sap_m09p11_m10p03_visual_walkthrough_v3_teaching_redo.py
            content/video-narration/review-sap-m09p11-m10p03-visual-walkthrough-v3-teaching-redo.json
            content/video-narration/review-sap-m09p11-m10p03-visual-walkthrough-v3-teaching-redo.sha256
          sparse-checkout-cone-mode: false
      - name: Verify exact inputs before any third-party work
        run: python3 scripts/review_sap_m09p11_m10p03_visual_walkthrough_v3_teaching_redo.py validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify FFmpeg and ffprobe
        timeout-minutes: 10
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 90s sudo -n apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
            timeout 360s sudo -n apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y ffmpeg
          fi
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
      - name: Install pinned edge-tts
        timeout-minutes: 4
        shell: bash
        run: |
          for attempt in 1 2; do
            if timeout 75s python -m pip install --disable-pip-version-check --timeout 15 --retries 1 'edge-tts==7.3.1'; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            sleep 3
          done
          python -c 'from importlib.metadata import version; v = version("edge-tts"); assert v == "7.3.1", v; print("edge-tts", v)'
      - name: Narrate exact review cues
        env:
          REVIEW_PART: ${{ matrix.part }}
        run: python scripts/review_sap_m09p11_m10p03_visual_walkthrough_v3_teaching_redo.py synthesize "$REVIEW_PART"
      - uses: actions/upload-artifact@v4
        with:
          name: sap-m09p11-m10p03-visual-walkthrough-v3-teaching-redo-${{ matrix.part }}-andrew-review
          path: voice-review/${{ matrix.part }}/
          retention-days: 3
          if-no-files-found: error
