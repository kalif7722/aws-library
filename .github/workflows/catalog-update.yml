name: Update AWS service catalog

on:
  push:
    paths:
      - '.github/workflows/catalog-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch service catalog safely
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/services/page.tsx')
          text = path.read_text(encoding='utf-8')

          marker = '];\n\nconst branches = ['
          additions = '''  { name: "AWS Management Console", file: "/el10/aws-management-console.webp", accent: "#2563eb", summary: "Web interface for accessing and managing AWS services" },
            { name: "AWS CLI", file: "/el10/aws-cli.webp", accent: "#f97316", summary: "Unified command-line interface for AWS services" },
            { name: "AWS AppConfig", file: "/el10/appconfig.webp", accent: "#db2777", summary: "Safely deploy feature flags and dynamic application configuration" },
            { name: "Savings Plans", file: "/el10/svgsavings-plans.webp", accent: "#16a34a", summary: "Commitment-based pricing for lower eligible AWS usage costs" },
          '''

          if 'file: "/el10/aws-management-console.webp"' not in text:
              if marker not in text:
                  raise SystemExit('services/branches marker not found; refusing unsafe update')
              text = text.replace(marker, additions + marker, 1)

          replacements = {
              '{ title: "Management & Governance", start: 0, end: 34, accent: "#f05aa6", copies: [215, 216] }':
              '{ title: "Management & Governance", start: 0, end: 34, accent: "#f05aa6", copies: [215, 216, 243, 244, 245] }',
              '{ title: "Developer Tools", start: 120, end: 132, accent: "#f97316", copies: [180] }':
              '{ title: "Developer Tools", start: 120, end: 132, accent: "#f97316", copies: [180, 244] }',
          }
          for old, new in replacements.items():
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'expected branch definition not found: {old}')
                  text = text.replace(old, new, 1)

          cfm = '  { title: "Cloud Financial Management", start: 0, end: 0, accent: "#16a34a", copies: [23, 24, 25, 9, 215, 216, 246] },\n'
          mgmt = '  { title: "Management & Governance", start: 0, end: 34, accent: "#f05aa6", copies: [215, 216, 243, 244, 245] },\n'
          if 'title: "Cloud Financial Management"' not in text:
              if mgmt not in text:
                  raise SystemExit('updated Management & Governance branch not found')
              text = text.replace(mgmt, mgmt + cfm, 1)

          alias_anchor = '  "AWS Cost Explorer": "cost billing spend optimization", "AWS Budgets": "cost alerts budget", "AWS Config": "compliance configuration audit",'
          alias_new = '  "AWS Cost Explorer": "cost billing spend optimization", "AWS Budgets": "cost alerts budget", "AWS Config": "compliance configuration audit",\n  "AWS Management Console": "console browser web interface access AWS services", "AWS CLI": "command line terminal developer tools automation", "AWS AppConfig": "feature flags dynamic configuration deployment", "Savings Plans": "cost savings commitment pricing cloud financial management",'
          if '"AWS Management Console": "console browser web interface access AWS services"' not in text:
              if alias_anchor not in text:
                  raise SystemExit('semantic alias anchor not found')
              text = text.replace(alias_anchor, alias_new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Verify catalog invariants
        shell: python
        run: |
          from pathlib import Path
          text = Path('app/services/page.tsx').read_text(encoding='utf-8')
          required = [
            '/el10/aws-management-console.webp', '/el10/aws-cli.webp', '/el10/appconfig.webp',
            '/el10/svgsavings-plans.webp', 'title: "Cloud Financial Management"',
            'copies: [215, 216, 243, 244, 245]', 'copies: [180, 244]'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing expected catalog updates: {missing}')
          if text.count('file: "/el10/aws-management-console.webp"') != 1:
              raise SystemExit('Management Console service record is not unique')
          if text.count('file: "/el10/aws-cli.webp"') != 1:
              raise SystemExit('AWS CLI service record is not unique')
          if text.count('file: "/el10/appconfig.webp"') != 1:
              raise SystemExit('AppConfig service record is not unique')
          if text.count('file: "/el10/svgsavings-plans.webp"') != 1:
              raise SystemExit('Savings Plans service record is not unique')
      - name: Commit catalog update
        run: |
          if git diff --quiet; then
            echo "Catalog already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/page.tsx
          git commit -m "Add management and cloud financial service guides"
          git push
