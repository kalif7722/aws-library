name: Replace only approved 49 SAP manifests
on:
  push:
    branches: ['stage/sap-direct-manifests-approved-20261123']
    paths: ['.github/workflows/sap-direct-manifests-approved-20261123.yml']
permissions:
  contents: read
concurrency:
  group: sap-direct-49-manifests
  cancel-in-progress: false
jobs:
  exact:
    if: github.ref == 'refs/heads/stage/sap-direct-manifests-approved-20261123' && github.repository == 'kalif7722/aws-library'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check boto3
      - name: Replace only exact backed-up legacy manifests conditionally
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python - <<'PY'
          import base64, concurrent.futures, contextlib, hashlib, json, os, re, urllib.parse, urllib.request, urllib.error
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError
          pins=[["release-manifests/pins-1.json","51147a6f1187abc6f2115cb3b7bc0b044eb54d0f836a2cf13fb8974bc65a86a7"],["release-manifests/pins-2.json","125d43e154f298990a6fd7738482e38663060248bee1b607c4a59e3ebffc20cd"],["release-manifests/pins-3.json","383c257a8dc781abd9a52d4eab5e47332ed7453778a9c60d72618099baed42b5"],["release-manifests/pins-4.json","efaa9b960b57ed4173277347da62663bdd05783c00394780117ccb0b76a4ec4a"],["release-manifests/pins-5.json","99593edaff773a7a1e164d0bbd00be00deeeeaaff14059676720037c29355ade"]]
          bucket='aws-el10-images'
          rev='2026-11-23-sap-through-m08-v1'
          R={'preflight':0,'written':[],'verified':[],'status':'stopped'}
          sha=lambda b:hashlib.sha256(b).hexdigest()
          def run():
           rows=[]
           for p,h in pins:
            raw=open(p,'rb').read();assert sha(raw)==h;rows+=json.loads(raw)
           assert len(rows)==len({x['part'] for x in rows})==49
           url=os.environ['R2_ENDPOINT']; u=urllib.parse.urlsplit(url)
           assert u.scheme=='https' and re.fullmatch(r'[a-z0-9-]+(?:\.[a-z0-9-]+)*\.r2\.cloudflarestorage\.com',u.hostname or '') and u.netloc==u.hostname and u.path in ('','/') and not u.query and not u.fragment
           c=boto3.client('s3',endpoint_url=url,region_name='auto',config=Config(signature_version='s3v4',connect_timeout=8,read_timeout=30,max_pool_connections=12,retries={'total_max_attempts':1},s3={'addressing_style':'path'},request_checksum_calculation='when_required',response_checksum_validation='when_required'))
           assert 'IfMatch' in c.meta.service_model.operation_model('PutObject').input_shape.members
           def get(k,e):
            z=c.get_object(Bucket=bucket,Key=k,IfMatch=e)
            with contextlib.closing(z['Body']) as body:raw=body.read()
            assert len(raw)==z['ContentLength'] and z['ETag']==e
            return raw,z
           def before(x):
            m=re.fullmatch(r'M(0[0-8])P(\d\d)',x['part']);assert m and x['part'] not in {'M06P04','M06P07','M06P09','M06P10'}
            a,b=m.groups();p=f'aws-course-videos/previews/sap/module-{a}/part-{b}/sap-module-{a}-part-{b}'
            old=x['old'];assert old['key']==p+'-manifest.json' and old['part']==x['part']
            raw=base64.b64decode(x['new_raw'],validate=True); assert len(raw)==x['new_len'] and sha(raw)==x['new_sha']
            j=json.loads(raw);assert (j['module'],j['part'],j['script_revision'],j['media_sha256'])==(a,b,rev,x['media'])
            s=j['scenes']; t=j['duration_seconds'];assert t>0 and len(s)==x['chapters']
            assert all(type(z['slide']) is int and z['title'] and 0<=z['start_seconds']<t and 0<z['duration_seconds'] and z['start_seconds']+z['duration_seconds']<=t+.03 for z in s)
            assert all(y['slide']==z['slide']+1 and y['start_seconds']>=z['start_seconds'] for z,y in zip(s,s[1:]))
            before,_=get(old['key'],old['etag']);assert len(before)==old['bytes'] and sha(before)==old['sha256']
            q=c.get_object(Bucket=bucket,Key=p+'.mp4'); h=hashlib.sha256();n=0
            with contextlib.closing(q['Body']) as body:
             for v in body.iter_chunks(chunk_size=1024*1024):h.update(v);n+=len(v)
            assert n==q['ContentLength']==x['media_len'] and h.hexdigest()==x['media']
            return x,raw,j
           with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool: ready=list(pool.map(before,rows))
           R['preflight']=len(ready); print('Preflight verified all 49 existing manifests and MP4s.',flush=True)
           for x,raw,j in ready:
            old=x['old']; R['attempted']=x['part']
            z=c.put_object(Bucket=bucket,Key=old['key'],Body=raw,ContentType='application/json',IfMatch=old['etag'])
            assert z['ResponseMetadata']['HTTPStatusCode']==200
            R['written'].append(x['part'])
            right,head=get(old['key'],z['ETag']); assert right==raw and sha(right)==x['new_sha'] and head['ContentType']=='application/json'
            R['verified'].append(dict(part=x['part'],sha256=x['new_sha'],bytes=len(right),etag=head['ETag'],revision=rev,duration=j['duration_seconds'],chapters=len(j['scenes'])))
           R['status']='verified'
           class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*a,**kw):return None
           def live(p):
            url=f'https://aws-library.kalifs.workers.dev/api/sap-video?module={p[1:3]}&part={p[4:]}'
            try:
             with urllib.request.build_opener(NoRedirect()).open(url,timeout=8) as o:
              j=json.load(o);return dict(part=p,http=o.status,state=j.get('status'),revision=j.get('revision'))
            except urllib.error.HTTPError as e:return dict(part=p,http=e.code)
            except Exception:return dict(part=p,state='connect_error')
           with concurrent.futures.ThreadPoolExecutor(max_workers=5) as q: R['live_samples']=list(q.map(live,['M00P01','M02P05','M03P01','M08P01','M08P07']))
          try:run()
          except ClientError as e:R['stop_category']='storage_http';R['stop_http']=e.response.get('ResponseMetadata',{}).get('HTTPStatusCode')
          except Exception:R['stop_category']='validation_or_connection'
          finally:
           open('replacement-receipt.json','w').write(json.dumps(R,indent=2))
           print(json.dumps({k:v for k,v in R.items() if k not in ('written','verified')}),flush=True)
           print('Acknowledged writes:',len(R['written']),'Verified after write:',len(R['verified']),flush=True)
          if R['status']!='verified':raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sap-direct-49-manifest-replacement-receipt
          path: replacement-receipt.json
          retention-days: 7
          if-no-files-found: error
