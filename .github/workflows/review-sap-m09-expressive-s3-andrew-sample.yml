name: SAP M09 S3 two-writer expressive Andrew sample
on:
  push:
    branches: [review/sap-m09-expressive-s3-andrew-sample]
    paths: [.github/workflows/review-sap-m09-expressive-s3-andrew-sample.yml, scripts/review_sap_m09_expressive_s3_andrew_sample.py, content/video-narration/review-sap-m09-expressive-s3-andrew-sample.json, content/video-narration/review-sap-m09-expressive-s3-andrew-sample.sha256]
permissions:
  contents: read
concurrency:
  group: sap-m09-expressive-s3-andrew-sample-review-only
  cancel-in-progress: false
jobs:
  voice:
    if: github.repository == 'kalif7722/aws-library' && github.event_name == 'push' && github.ref == 'refs/heads/review/sap-m09-expressive-s3-andrew-sample'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: [m09p01]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/review_sap_m09_expressive_s3_andrew_sample.py
            content/video-narration/review-sap-m09-expressive-s3-andrew-sample.json
            content/video-narration/review-sap-m09-expressive-s3-andrew-sample.sha256
          sparse-checkout-cone-mode: false
      - name: Verify exact inputs before any third-party work
        run: python3 scripts/review_sap_m09_expressive_s3_andrew_sample.py validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned edge-tts
        timeout-minutes: 4
        shell: bash
        run: |
          for attempt in 1 2; do
            if timeout 75s python -m pip install --disable-pip-version-check --timeout 15 --retries 1 'edge-tts==7.3.1'; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            sleep 3
          done
          python -c 'from importlib.metadata import version; v = version("edge-tts"); assert v == "7.3.1", v; print("edge-tts", v)'
      - name: Narrate exact review cues
        env:
          REVIEW_PART: ${{ matrix.part }}
        run: python scripts/review_sap_m09_expressive_s3_andrew_sample.py synthesize "$REVIEW_PART"
      - uses: actions/upload-artifact@v4
        with:
          name: sap-m09-expressive-s3-andrew-sample-${{ matrix.part }}-review
          path: voice-review/${{ matrix.part }}/
          retention-days: 3
          if-no-files-found: error
