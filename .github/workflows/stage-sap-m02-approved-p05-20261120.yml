      - name: Prepare encrypted create-only handoff using existing repository secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python - <<'PY'
          import os,json,subprocess,time,re,urllib.parse
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError
          try:
              endpoint=os.environ["R2_ENDPOINT"]; u=urllib.parse.urlsplit(endpoint)
              assert u.scheme=="https" and re.fullmatch(r"[a-z0-9-]+(?:\.[a-z0-9-]+)*\.r2\.cloudflarestorage\.com",u.hostname or "") and u.netloc==u.hostname and u.path in ("","/") and not u.query and not u.fragment
              bucket=os.environ["R2_BUCKET"]
              assert re.fullmatch(r"[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]",bucket)
              api=boto3.client("s3",endpoint_url=endpoint,region_name="auto",config=Config(signature_version="s3v4",s3={"addressing_style":"path"},request_checksum_calculation="when_required",response_checksum_validation="when_required"))
              items=json.loads("[{\"key\":\"aws-course-videos/previews/sap/module-02/releases/2026-11-20-m02p05-fresh-animation-v1/part-05/sap-module-02-part-05.mp4\",\"bytes\":67919001,\"sha256\":\"5f0b673badd310b2f81280631ff57b9bfcc39fb6a1ee973298bd186b97444fdf\",\"content_type\":\"video/mp4\"},{\"key\":\"aws-course-videos/previews/sap/module-02/releases/2026-11-20-m02p05-fresh-animation-v1/part-05/sap-module-02-part-05.vtt\",\"bytes\":6911,\"sha256\":\"54fa959648870fcf4eff4d0ec4f9d0179811861f0913c49ca362125cb1fdb0a2\",\"content_type\":\"text/vtt\"},{\"key\":\"aws-course-videos/previews/sap/module-02/releases/2026-11-20-m02p05-fresh-animation-v1/part-05/sap-module-02-part-05.srt\",\"bytes\":7002,\"sha256\":\"89464756e247fb888d3fe18549dff0bd8111fd4e7f0af843d8eb513c092f45e4\",\"content_type\":\"application/x-subrip\"},{\"key\":\"aws-course-videos/previews/sap/module-02/releases/2026-11-20-m02p05-fresh-animation-v1/part-05/sap-module-02-part-05-transcript.txt\",\"bytes\":5822,\"sha256\":\"dd94ece57126b92fa20c1bac7b782fe38172f2f97e2468a7c42d5a601d116fa2\",\"content_type\":\"text/plain\"},{\"key\":\"aws-course-videos/previews/sap/module-02/releases/2026-11-20-m02p05-fresh-animation-v1/part-05/sap-module-02-part-05-manifest.json\",\"bytes\":1365,\"sha256\":\"6b47a36f2b6b57faab68316fac44f66ff57fbfb286e8f054ab39d7862c1bfa7b\",\"content_type\":\"application/json\"}]")
              assert len(items)==5 and len({x["key"] for x in items})==5
              for x in items:
                  assert re.fullmatch(r"aws-course-videos/previews/sap/module-02/releases/2026-11-20-m02p05-fresh-animation-v1/part-05/sap-module-02-part-05(\.mp4|\.vtt|\.srt|-transcript\.txt|-manifest\.json)",x["key"])
                  try: api.head_object(Bucket=bucket,Key=x["key"])
                  except ClientError as e:
                      if str(e.response["Error"]["Code"]) not in ("404","NoSuchKey","NotFound"): raise RuntimeError()
                  else: raise RuntimeError()
              assert "IfNoneMatch" in api.meta.service_model.operation_model("PutObject").input_shape.members
              for x in items:
                  x["put_url"]=api.generate_presigned_url("put_object",Params={"Bucket":bucket,"Key":x["key"],"ContentType":x["content_type"],"ContentLength":x["bytes"],"Metadata":{"sha256":x["sha256"]},"IfNoneMatch":"*"},ExpiresIn=900,HttpMethod="PUT")
              payload=json.dumps({"expires_at":int(time.time())+900,"objects":items}).encode()
              os.makedirs("encrypted",exist_ok=True)
              subprocess.run(["openssl","cms","-encrypt","-binary","-aes-256-cbc","-outform","DER","-out","encrypted/targets.cms","recipient.crt"],input=payload,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              print("Prepared encrypted 15-minute create-only upload handoff for 5 approved M02 Part 05 objects. No download permissions generated.")
          except Exception:
              print("Staging failed; no permission or credential details emitted.")
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sap-m02-approved-p05-encrypted-upload-handoff
          path: encrypted/targets.cms
          retention-days: 1
          if-no-files-found: error
