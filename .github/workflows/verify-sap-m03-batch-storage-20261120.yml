name: Verify exact SAP M03 Parts 01, 04 and 06 staged storage
on:
  push:
    branches: [review/verify-sap-m03-batch-storage-20261120]
    paths: [.github/workflows/verify-sap-m03-batch-storage-20261120.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: python -m pip install --disable-pip-version-check boto3
      - name: Read only 15 pinned objects through existing storage authorization
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python - <<'PY'
          import os,json,re,urllib.parse,hashlib
          import boto3
          from botocore.config import Config
          try:
              endpoint=os.environ["R2_ENDPOINT"]; u=urllib.parse.urlsplit(endpoint)
              assert u.scheme=="https" and re.fullmatch(r"[a-z0-9-]+(?:\.[a-z0-9-]+)*\.r2\.cloudflarestorage\.com",u.hostname or "") and u.netloc==u.hostname and u.path in ("","/") and not u.query and not u.fragment
              bucket=os.environ["R2_BUCKET"]
              api=boto3.client("s3",endpoint_url=endpoint,region_name="auto",config=Config(signature_version="s3v4",retries={"total_max_attempts":1},s3={"addressing_style":"path"}))
              items=json.loads("[{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p01-approved-animation-v1/part-01/sap-module-03-part-01.mp4\",\"bytes\":26248297,\"sha256\":\"0aca674641c0a64857d84b8bfbe400a71a1e59f27592bfa0f6dc6ff177daf10b\",\"content_type\":\"video/mp4\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p01-approved-animation-v1/part-01/sap-module-03-part-01.vtt\",\"bytes\":2531,\"sha256\":\"8b4492490d76d63b89cee5cc3975cb28eba473d74b784ae12bddf40f83895494\",\"content_type\":\"text/vtt\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p01-approved-animation-v1/part-01/sap-module-03-part-01.srt\",\"bytes\":2556,\"sha256\":\"dbc715cdc353bfe9e7a0def7bce79e839689cfb61026ef21a747cd49c46f9b97\",\"content_type\":\"application/x-subrip\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p01-approved-animation-v1/part-01/sap-module-03-part-01-transcript.txt\",\"bytes\":2101,\"sha256\":\"ae1ed763ca21cb520287a701fddd64de598c774f70fb996eef14a1e7c0aca451\",\"content_type\":\"text/plain\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p01-approved-animation-v1/part-01/sap-module-03-part-01-manifest.json\",\"bytes\":839,\"sha256\":\"29b7bd164cdf78d956faa669734368c5dd3710ed8a128173ce07e336588094f7\",\"content_type\":\"application/json\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p04-approved-animation-v1/part-04/sap-module-03-part-04.mp4\",\"bytes\":25881116,\"sha256\":\"5b6c37febcd0cb9589ed6f1bef99a6cd21ad11e30a7d16e0a5d4bf784480970a\",\"content_type\":\"video/mp4\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p04-approved-animation-v1/part-04/sap-module-03-part-04.vtt\",\"bytes\":2685,\"sha256\":\"e0480da26f1ed758bb1f69b279bf9e77ff0691ef7a38941015034fb04f58eafc\",\"content_type\":\"text/vtt\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p04-approved-animation-v1/part-04/sap-module-03-part-04.srt\",\"bytes\":2713,\"sha256\":\"3696ac5681a18f55f8838e6f7e1b5968675a9d2855003cd66ec9fd8498b4d44b\",\"content_type\":\"application/x-subrip\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p04-approved-animation-v1/part-04/sap-module-03-part-04-transcript.txt\",\"bytes\":2225,\"sha256\":\"5e207acd36bd69e1a1eabd6e0b7cf9ffcbf20d3e3eca73882a3b42adb2af5686\",\"content_type\":\"text/plain\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p04-approved-animation-v1/part-04/sap-module-03-part-04-manifest.json\",\"bytes\":826,\"sha256\":\"174733ef623c00563cb03f61a96a2cb80b98aa848998b1f39d53d055066c62b1\",\"content_type\":\"application/json\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p06-approved-animation-v1/part-06/sap-module-03-part-06.mp4\",\"bytes\":27588461,\"sha256\":\"f62a3df7654b776fbbbfc33276c5efe67b2fb1b89b7755b9bc3377c44af281a0\",\"content_type\":\"video/mp4\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p06-approved-animation-v1/part-06/sap-module-03-part-06.vtt\",\"bytes\":3107,\"sha256\":\"9be36523d275d232d753d23fd1ff97ef3f7996d7623d79f4f601e00c63246f29\",\"content_type\":\"text/vtt\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p06-approved-animation-v1/part-06/sap-module-03-part-06.srt\",\"bytes\":3135,\"sha256\":\"be77e6dab5f0b38e0c95487b909fea3642fcae23335d15373d772ac871d2d470\",\"content_type\":\"application/x-subrip\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p06-approved-animation-v1/part-06/sap-module-03-part-06-transcript.txt\",\"bytes\":2647,\"sha256\":\"1872f249fea01bf5667087f400fe01b15d70354baf578de0096dedd76118851e\",\"content_type\":\"text/plain\"},{\"key\":\"aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p06-approved-animation-v1/part-06/sap-module-03-part-06-manifest.json\",\"bytes\":834,\"sha256\":\"1ae7c1472b6dbbd33c832e52146483da404d9be12b3234f449a1ccb2108bd2f5\",\"content_type\":\"application/json\"}]")
              assert len(items)==15
              results=[]
              for x in items:
                  assert x["key"] in ["aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p01-approved-animation-v1/part-01/sap-module-03-part-01.mp4","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p01-approved-animation-v1/part-01/sap-module-03-part-01.vtt","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p01-approved-animation-v1/part-01/sap-module-03-part-01.srt","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p01-approved-animation-v1/part-01/sap-module-03-part-01-transcript.txt","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p01-approved-animation-v1/part-01/sap-module-03-part-01-manifest.json","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p04-approved-animation-v1/part-04/sap-module-03-part-04.mp4","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p04-approved-animation-v1/part-04/sap-module-03-part-04.vtt","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p04-approved-animation-v1/part-04/sap-module-03-part-04.srt","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p04-approved-animation-v1/part-04/sap-module-03-part-04-transcript.txt","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p04-approved-animation-v1/part-04/sap-module-03-part-04-manifest.json","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p06-approved-animation-v1/part-06/sap-module-03-part-06.mp4","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p06-approved-animation-v1/part-06/sap-module-03-part-06.vtt","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p06-approved-animation-v1/part-06/sap-module-03-part-06.srt","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p06-approved-animation-v1/part-06/sap-module-03-part-06-transcript.txt","aws-course-videos/previews/sap/module-03/releases/2026-11-20-m03p06-approved-animation-v1/part-06/sap-module-03-part-06-manifest.json"]
                  h=api.head_object(Bucket=bucket,Key=x["key"])
                  assert h["ContentLength"]==x["bytes"] and h["ContentType"]==x["content_type"]
                  assert h["Metadata"]["sha256"]==x["sha256"]
                  r=api.get_object(Bucket=bucket,Key=x["key"])
                  digest=hashlib.sha256();size=0
                  for block in r["Body"].iter_chunks(chunk_size=1024*1024): digest.update(block);size+=len(block)
                  r["Body"].close()
                  assert size==x["bytes"] and digest.hexdigest()==x["sha256"]
                  results.append({"pass":True,"bytes":size,"sha256":digest.hexdigest()})
                  print(json.dumps(results[-1]),flush=True)
              open("storage-verification.json","w").write(json.dumps(results,indent=2))
          except Exception:
              print("FAIL: exact-object storage verification stopped; no retry or sensitive details emitted.")
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sap-m03-batch-storage-verification
          path: storage-verification.json
          retention-days: 7
          if-no-files-found: error
