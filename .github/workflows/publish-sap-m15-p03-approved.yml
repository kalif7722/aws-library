name: Prepare approved SAP Part 03 upload
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-sap-m15-p03-approved.yml"]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - run: pip install boto3
      - name: Prepare short-lived object-specific uploads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python - <<'PY'
          import boto3,os,json
          from botocore.config import Config
          c=boto3.client("s3",endpoint_url=os.environ["R2_ENDPOINT"],region_name="auto",config=Config(signature_version="s3v4"))
          prefix="aws-course-videos/previews/sap/module-15/part-03/sap-module-15-part-03"
          result={}
          for ext in [".mp4",".vtt",".srt","-transcript.txt","-manifest.json"]:
              result[ext]=c.generate_presigned_url("put_object",Params={"Bucket":os.environ["R2_BUCKET"],"Key":prefix+ext},ExpiresIn=600,HttpMethod="PUT")
          open("upload-targets.json","w").write(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scoped-upload-targets
          path: upload-targets.json
          retention-days: 1
