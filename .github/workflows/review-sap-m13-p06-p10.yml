name: SAP M13 parts 06–10 Andrew narration review
on:
  push:
    branches: [review/sap-m13-p06-p10]
    paths: [.github/workflows/review-sap-m13-p06-p10.yml, scripts/review_sap_m13_p06_p10.py, content/video-narration/review-sap-m13-p06-p10.json, content/video-narration/review-sap-m13-p06-p10.sha256]
permissions:
  contents: read
concurrency:
  group: sap-m13-p06-p10-review-only
  cancel-in-progress: false
jobs:
  voice:
    if: github.repository == 'kalif7722/aws-library' && github.event_name == 'push' && github.ref == 'refs/heads/review/sap-m13-p06-p10'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        part: [m13p06, m13p07, m13p08, m13p09, m13p10]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/review_sap_m13_p06_p10.py
            content/video-narration/review-sap-m13-p06-p10.json
            content/video-narration/review-sap-m13-p06-p10.sha256
          sparse-checkout-cone-mode: false
      - name: Verify exact inputs before any third-party work
        run: python3 scripts/review_sap_m13_p06_p10.py validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install established audio tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --disable-pip-version-check 'edge-tts==7.3.1'
      - name: Narrate exact review cues
        env:
          REVIEW_PART: ${{ matrix.part }}
        run: python scripts/review_sap_m13_p06_p10.py synthesize "$REVIEW_PART"
      - uses: actions/upload-artifact@v4
        with:
          name: sap-m13-p06-p10-${{ matrix.part }}-andrew-review
          path: voice-review/${{ matrix.part }}/
          retention-days: 3
          if-no-files-found: error
