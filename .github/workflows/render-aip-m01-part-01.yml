name: Build AIP Module 01 Part 01 when source slides are valid

on:
  push:
    branches: [main]
    paths:
      - "content/video-narration/aip-module-01-part-01.json"
      - "scripts/render_aip_course_video.py"
      - "scripts/aip_tts_reliability.py"
      - ".github/workflows/render-aip-m01-part-01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aip-module-01-part-01-video
  cancel-in-progress: true

jobs:
  render:
    name: Render foundation models lecture only after full slide preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: |
          # GitHub-hosted Ubuntu runners already include FFmpeg.
          # Avoid apt-get: Ubuntu mirror DNS failures can stall video builds.
          command -v ffmpeg || { echo "::error::FFmpeg is not on the runner PATH"; exit 1; }
          command -v ffprobe || { echo "::error::FFprobe is not on the runner PATH"; exit 1; }
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
          python -m pip install --disable-pip-version-check --retries 3 --timeout 20 "edge-tts>=7,<8" "Pillow>=10,<13" "requests>=2.31,<3"
          python -m py_compile scripts/render_aip_course_video.py scripts/publish_aip_video_release.py scripts/aip_tts_reliability.py

      - name: Preflight original R2 slides 01–09
        id: preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import json, requests, os

          manifest = json.loads(Path("content/video-narration/aip-module-01-part-01.json").read_text())
          root = manifest["slide_base"].rstrip("/")
          scenes = manifest["scenes"]
          if [s["slide"] for s in scenes] != list(range(1, 10)):
              raise SystemExit("Narration scene IDs must exactly match slides 01–09.")
          status = []
          session = requests.Session()
          for scene in scenes:
              slide = scene["slide"]
              url = f"{root}/module-01/slide-{slide:02}.webp"
              try:
                  result = session.get(url, timeout=25)
                  result.raise_for_status()
                  with Image.open(BytesIO(result.content)) as img:
                      img.verify()
                  if len(result.content) < 1000:
                      raise ValueError("Image is empty or unexpectedly short")
                  status.append({"slide": slide, "ok": True, "bytes": len(result.content)})
              except Exception as exc:
                  status.append({"slide": slide, "ok": False, "error": str(exc)})
          ready = all(x["ok"] for x in status)
          dest = Path("video-output/part-01")
          dest.mkdir(parents=True, exist_ok=True)
          (dest / "source-preflight.json").write_text(json.dumps({
              "status": "ready" if ready else "blocked_source_asset",
              "slides": status,
              "narration_revision": manifest["script_revision"],
          }, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("available=" + ("true" if ready else "false") + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Module 01 Part 01 source preflight\n\n")
              for item in status:
                  summary.write(f"- Slide {item['slide']:02}: {'VALID' if item['ok'] else 'BLOCKED: ' + item['error']}\n")
              summary.write("\n**Rendering:** " + ("Ready to start" if ready else "Skipped until the original slide is repaired") + "\n")
          print("Source slide preflight:", "READY" if ready else "BLOCKED")
          PY

      - name: Restore successful neural narration chunks
        if: steps.preflight.outputs.available == 'true'
        uses: actions/cache/restore@v4
        with:
          path: video-output/part-01/_work/audio
          key: aip-m01-p01-tts-${{ hashFiles('content/video-narration/aip-module-01-part-01.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aip-m01-p01-tts-${{ hashFiles('content/video-narration/aip-module-01-part-01.json') }}-

      - name: Render complete nine-slide lecturer video
        if: steps.preflight.outputs.available == 'true'
        run: |
          python scripts/render_aip_course_video.py \
            --manifest content/video-narration/aip-module-01-part-01.json \
            --output video-output/part-01 --width 1920 --height 1080 --fps 24

      - name: Preserve completed speech chunks even if another TTS request fails
        if: always() && steps.preflight.outputs.available == 'true'
        uses: actions/cache/save@v4
        with:
          path: video-output/part-01/_work/audio
          key: aip-m01-p01-tts-${{ hashFiles('content/video-narration/aip-module-01-part-01.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate video chapters and duration
        if: steps.preflight.outputs.available == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          m = json.loads(Path("video-output/part-01/aip-module-01-part-01-manifest.json").read_text())
          assert m["script_revision"] == "2026-11-11-m01-p01-visual-aligned-v1"
          assert [x["slide"] for x in m["scenes"]] == list(range(1, 10))
          assert m["duration_seconds"] > 420
          print("Confirmed nine chapters and", m["duration_seconds"], "seconds")
          PY
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            video-output/part-01/aip-module-01-part-01.mp4

      - name: Save build artifacts including the preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aip-module-01-part-01-status-and-video
          path: |
            video-output/part-01/source-preflight.json
            video-output/part-01/aip-module-01-part-01.mp4
            video-output/part-01/aip-module-01-part-01.vtt
            video-output/part-01/aip-module-01-part-01.srt
            video-output/part-01/aip-module-01-part-01-transcript.txt
            video-output/part-01/aip-module-01-part-01-manifest.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload verified video and transcripts to R2
        if: steps.preflight.outputs.available == 'true'
        id: media
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "R2 credentials missing; video artifact remains available for review."
            exit 0
          fi
          PREFIX="aws-course-videos/previews/aip/module-01/part-01"
          FILE="aip-module-01-part-01"
          for ext in mp4 vtt srt txt json; do
            case "$ext" in
              mp4) src="video-output/part-01/$FILE.mp4"; mime="video/mp4"; suffix="$FILE.mp4";;
              vtt) src="video-output/part-01/$FILE.vtt"; mime="text/vtt"; suffix="$FILE.vtt";;
              srt) src="video-output/part-01/$FILE.srt"; mime="application/x-subrip"; suffix="$FILE.srt";;
              txt) src="video-output/part-01/$FILE-transcript.txt"; mime="text/plain"; suffix="$FILE-transcript.txt";;
              json) src="video-output/part-01/$FILE-manifest.json"; mime="application/json"; suffix="$FILE-manifest.json";;
            esac
            aws s3 cp "$src" "s3://$R2_BUCKET/$PREFIX/$suffix" \
              --endpoint-url "$R2_ENDPOINT" --content-type "$mime" --no-progress
          done
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Record verified upload without rebasing main
        if: steps.media.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publish_aip_video_release.py \
            --manifest video-output/part-01/aip-module-01-part-01-manifest.json
