name: Sync EL10 assets to Cloudflare R2

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - ".github/workflows/sync-r2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure R2 credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Sync image assets
        run: |
          test -d assets
          aws s3 sync assets/ "s3://${{ secrets.R2_BUCKET }}"             --endpoint-url "${{ secrets.R2_ENDPOINT }}"             --no-progress             --only-show-errors             --cache-control "public,max-age=31536000,immutable"
