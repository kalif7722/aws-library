name: Sync EL10 assets to Cloudflare R2

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - ".github/workflows/sync-r2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-r2:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify R2 configuration
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "${{ secrets.R2_ENDPOINT }}"
          test -n "${{ secrets.R2_BUCKET }}"

      - name: Sync image assets to R2
        run: |
          aws s3 sync assets/ "s3://${{ secrets.R2_BUCKET }}" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --no-progress \
            --only-show-errors \
            --cache-control "public,max-age=31536000,immutable"

      - name: Remove synced EL10 files from runner workspace
        if: success()
        run: |
          # This cleanup happens only after a successful R2 sync.
          # It does not modify the Git commit or delete objects from R2.
          if [ -d assets/el10 ]; then
            find assets/el10 -type f -delete
            find assets/el10 -depth -type d -empty -delete
          fi
