name: SAP IPsec cue pronunciation review
on:
  push:
    branches: [review/sap-ipsec-native-final]
    paths: [.github/workflows/review-sap-ipsec-native-final.yml, scripts/review_sap_ipsec_native_final.py, content/video-narration/review-sap-ipsec-native-final.json, content/video-narration/review-sap-ipsec-native-final.sha256]
permissions:
  contents: read
concurrency:
  group: sap-ipsec-native-final-review-only
  cancel-in-progress: false
jobs:
  voice:
    if: github.repository == 'kalif7722/aws-library' && github.event_name == 'push' && github.ref == 'refs/heads/review/sap-ipsec-native-final'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: [m06p04, m06p09, m06p10]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/review_sap_ipsec_native_final.py
            content/video-narration/review-sap-ipsec-native-final.json
            content/video-narration/review-sap-ipsec-native-final.sha256
          sparse-checkout-cone-mode: false
      - name: Verify exact inputs before any third-party work
        run: python3 scripts/review_sap_ipsec_native_final.py validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install established audio tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --disable-pip-version-check 'edge-tts==7.3.1'
      - name: Narrate exact review cues
        env:
          REVIEW_PART: ${{ matrix.part }}
        run: python scripts/review_sap_ipsec_native_final.py synthesize "$REVIEW_PART"
      - uses: actions/upload-artifact@v4
        with:
          name: sap-ipsec-native-final-${{ matrix.part }}-andrew-review
          path: voice-review/${{ matrix.part }}/
          retention-days: 3
          if-no-files-found: error
