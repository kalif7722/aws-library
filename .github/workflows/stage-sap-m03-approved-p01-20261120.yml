name: Stage exact approved SAP M03 Part 01 release
on:
  push:
    branches: [stage/sap-m03-approved-p01-20261120]
    paths: [.github/workflows/stage-sap-m03-approved-p01-20261120.yml]
permissions:
  contents: read
concurrency:
  group: sap-m03-approved-p01-20261120
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/stage/sap-m03-approved-p01-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install official SDK
        run: python -m pip install --disable-pip-version-check boto3
      - name: Write public encryption recipient
        run: |
          cat > recipient.crt <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEGTCCAoGgAwIBAgIUJxn2NkPLEFW8ZAjfqu0hDRIDwdswDQYJKoZIhvcNAQEL
