name: Render AIP Module 08 — original-slide Videos 07 to 09

on:
  push:
    branches: [main]
    paths:
      - "content/video-narration/aip-module-08-part-07.json"
      - "content/video-narration/aip-module-08-part-08.json"
      - "content/video-narration/aip-module-08-part-09.json"
      - ".github/workflows/render-aip-m08-parts-07-09.yml"
  workflow_dispatch:

permissions:
  contents: write

# Recovery group deliberately differs from the old artifact-backend groups:
# orphaned queued runs in the previous group must not block new validated builds.
concurrency:
  group: aip-m08-video-topic-07-09-v2
  cancel-in-progress: false

jobs:
  render:
    name: M08 Part ${{ matrix.part }} — narrated AWS data diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - part: "07"
            start: 31
            end: 32
            revision: "2026-11-12-m08-p07-topic-waf-v2"
          - part: "08"
            start: 33
            end: 38
            revision: "2026-11-12-m08-p08-topic-vpc-v2"
          - part: "09"
            start: 39
            end: 44
            revision: "2026-11-12-m08-p09-topic-private-v2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check R2 manifest and MP4 before deciding whether to rerender
        id: existing
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PART: ${{ matrix.part }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          REVISION: ${{ matrix.revision }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "::error::R2 credentials are required to verify published lecture objects."
            exit 1
          fi
          PREFIX="aws-course-videos/previews/aip/module-08/part-$PART"
          STEM="aip-module-08-part-$PART"
          ready="false"
          if aws s3api head-object --bucket "$R2_BUCKET" --key "$PREFIX/$STEM.mp4" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1 &&
             aws s3 cp "s3://$R2_BUCKET/$PREFIX/$STEM-manifest.json" "/tmp/$STEM-manifest.json" --endpoint-url "$R2_ENDPOINT" --no-progress >/dev/null 2>&1; then
            if python - <<'PY'
          import json,os,math
          from pathlib import Path
          p=os.environ["PART"]; m=json.loads(Path(f"/tmp/aip-module-08-part-{p}-manifest.json").read_text())
          scenes=m.get("scenes",[])
          expected=list(range(int(os.environ["START"]),int(os.environ["END"])+1))
          actual=[scene.get("slide") for scene in scenes]
          revision_ok=m.get("script_revision")==os.environ["REVISION"]
          ordered=actual==expected
          timing=all(isinstance(s.get("start_seconds"),(float,int)) and isinstance(s.get("duration_seconds"),(float,int)) and math.isfinite(s["start_seconds"]) and math.isfinite(s["duration_seconds"]) for s in scenes)
          print("R2 manifest:", {"part":p,"revision":m.get("script_revision"),"slides":actual,"expected_revision":os.environ["REVISION"],"expected_slides":expected,"timing":timing},flush=True)
          assert revision_ok and ordered and timing
          PY
            then ready="true"; fi
          else
            echo "R2 MP4 or manifest is missing for Part $PART."
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" == "true" ]]; then
            echo "M08 Video $PART already has the correct MP4 and topic-based manifest; preserving existing files." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "M08 Video $PART has missing or outdated R2 media; rebuilding from current narration." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install narration and video engine
        if: steps.existing.outputs.ready != 'true'
        run: |
          # Use wheel-bundled FFmpeg rather than apt or runner PATH.
          # Mutagen reads MP3/MP4 durations; no FFprobe binary is needed.
          python -m pip install --disable-pip-version-check --retries 3 --timeout 20 "edge-tts>=7,<8" "Pillow>=10,<13" "requests>=2.31,<3" "imageio-ffmpeg>=0.6,<1" "mutagen>=1.47,<2"
          python - <<'PY'
          import subprocess
          from imageio_ffmpeg import get_ffmpeg_exe
          from mutagen import File
          executable = get_ffmpeg_exe()
          result = subprocess.run([executable, "-version"], capture_output=True, text=True, check=True)
          print("Bundled FFmpeg available:", executable)
          print(result.stdout.splitlines()[0])
          print("Mutagen available:", File)
          PY
          python -m py_compile scripts/render_aip_course_video.py scripts/aip_tts_reliability.py scripts/publish_aip_video_release.py scripts/aip_media_tools.py

      - name: Confirm the actual original slide range and narration revision
        if: steps.existing.outputs.ready != 'true'
        env:
          PART: ${{ matrix.part }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          REVISION: ${{ matrix.revision }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=os.environ["PART"]
          m=json.loads(Path(f"content/video-narration/aip-module-08-part-{p}.json").read_text())
          slides=list(range(int(os.environ["START"]),int(os.environ["END"])+1))
          assert m["module_id"]=="08" and m["part_id"]==p
          assert m["script_revision"]==os.environ["REVISION"]
          assert [s["slide"] for s in m["scenes"]]==slides
          assert all(len(s["narration"].split())>=100 for s in m["scenes"])
          print(f"Verified M08 Part {p}: {len(slides)} visually grounded lecture scenes")
          PY

      - name: Restore existing valid audio chunks from a previous interrupted run
        if: steps.existing.outputs.ready != 'true'
        uses: actions/cache/restore@v4
        with:
          path: video-output/part-${{ matrix.part }}/_work/audio
          key: aip-m08-p${{ matrix.part }}-tts-m08topic07-09-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aip-m08-p${{ matrix.part }}-tts-m08topic07-09-v2-

      - name: Verify live R2 originals and render narration in one consistent voice
        if: steps.existing.outputs.ready != 'true'
        env:
          # Edge TTS occasionally needs >6 tries for the same chunk.
          AIP_TTS_MAX_ATTEMPTS: "15"
          AIP_TTS_RETRY_SLEEP_CAP_SECONDS: "30"
        run: |
          python scripts/render_aip_course_video.py \
            --manifest content/video-narration/aip-module-08-part-${{ matrix.part }}.json \
            --output video-output/part-${{ matrix.part }} \
            --width 1920 --height 1080 --fps 24

      - name: Save completed audio on success or failure
        if: always() && steps.existing.outputs.ready != 'true'
        uses: actions/cache/save@v4
        with:
          path: video-output/part-${{ matrix.part }}/_work/audio
          key: aip-m08-p${{ matrix.part }}-tts-m08topic07-09-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify playable MP4, subtitles, duration and slide order
        if: steps.existing.outputs.ready != 'true'
        env:
          PART: ${{ matrix.part }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          REVISION: ${{ matrix.revision }}
        run: |
          python - <<'PY'
          import json,os
          from scripts.aip_media_tools import media_seconds
          from pathlib import Path
          p=os.environ["PART"]
          folder=Path(f"video-output/part-{p}")
          stem=f"aip-module-08-part-{p}"
          m=json.loads((folder/f"{stem}-manifest.json").read_text())
          expected=list(range(int(os.environ["START"]),int(os.environ["END"])+1))
          assert m["script_revision"]==os.environ["REVISION"]
          assert [s["slide"] for s in m["scenes"]]==expected
          assert m["duration_seconds"]>len(expected)*30
          duration=media_seconds(folder/f"{stem}.mp4")
          assert abs(duration-m["duration_seconds"])<3.5
          assert (folder/f"{stem}.vtt").read_text().startswith("WEBVTT")
          assert (folder/f"{stem}-transcript.txt").is_file()
          print(f"Ready: {stem}.mp4, {duration:.1f}s, {len(expected)} chapters")
          PY

      # GitHub's artifact backend can return HTML instead of JSON.
      # Cloudflare R2 is authoritative; enable previews only by explicit opt-in.
      - name: Save optional GitHub preview artifact
        if: steps.existing.outputs.ready != 'true' && vars.AIP_UPLOAD_GITHUB_PREVIEW == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aip-module-08-part-${{ matrix.part }}-lecture-preview
          path: |
            video-output/part-${{ matrix.part }}/aip-module-08-part-${{ matrix.part }}.mp4
            video-output/part-${{ matrix.part }}/aip-module-08-part-${{ matrix.part }}.vtt
            video-output/part-${{ matrix.part }}/aip-module-08-part-${{ matrix.part }}.srt
            video-output/part-${{ matrix.part }}/aip-module-08-part-${{ matrix.part }}-transcript.txt
            video-output/part-${{ matrix.part }}/aip-module-08-part-${{ matrix.part }}-manifest.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish only verified files to Cloudflare R2
        if: steps.existing.outputs.ready != 'true'
        id: media
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PART: ${{ matrix.part }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "::error::Missing R2 credentials; the video cannot be published to the course site. Configure R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT and R2_BUCKET."
            exit 1
          fi
          STEM="aip-module-08-part-$PART"
          PREFIX="aws-course-videos/previews/aip/module-08/part-$PART"
          SRC="video-output/part-$PART"
          for ext in mp4 vtt srt txt json; do
            case "$ext" in
              mp4) suffix="$STEM.mp4"; mime="video/mp4";;
              vtt) suffix="$STEM.vtt"; mime="text/vtt";;
              srt) suffix="$STEM.srt"; mime="application/x-subrip";;
              txt) suffix="$STEM-transcript.txt"; mime="text/plain";;
              json) suffix="$STEM-manifest.json"; mime="application/json";;
            esac
            aws s3 cp "$SRC/$suffix" "s3://$R2_BUCKET/$PREFIX/$suffix" \
              --endpoint-url "$R2_ENDPOINT" --content-type "$mime" \
              --cache-control "public,max-age=3600" --no-progress
          done
          aws s3api head-object --bucket "$R2_BUCKET" --key "$PREFIX/$STEM.mp4" \
            --endpoint-url "$R2_ENDPOINT" >/dev/null
          aws s3api head-object --bucket "$R2_BUCKET" --key "$PREFIX/$STEM-manifest.json" \
            --endpoint-url "$R2_ENDPOINT" >/dev/null
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      # R2 media and verified manifest are authoritative. Skip GitHub release-record registration.
