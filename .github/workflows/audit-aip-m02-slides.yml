name: Audit AIP Module 02 source slides 1–160

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_aip_r2_module.py"
      - ".github/workflows/audit-aip-m02-slides.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Compare published R2 files against 144 mapped M02 lessons
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify every original WebP image using Pillow
        run: |
          python -m pip install "Pillow>=10,<13" "requests>=2.31,<3"
          python scripts/audit_aip_r2_module.py \
            --module 02 --mapped-count 144 --up-to 160 \
            --output video-review/aip/module-02-r2-inventory.json

      - name: Summarize actual slides and possible extra console walkthroughs
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("video-review/aip/module-02-r2-inventory.json")
          d=json.loads(p.read_text())
          summary=[
            "## AIP Module 02 — R2 source-of-truth image audit","",
            f"- Mapped lessons: **{d['mapped_lessons']}**",
            f"- Verified WebP images in R2: **{d['available_count']}**",
            f"- Missing images within the map: **{d['missing_mapped_slides']}**",
            f"- Real images beyond the map: **{d['available_beyond_map']}**",
            f"- Duplicate image hashes: **{d['duplicate_hashes']}**",
            "",
            "This report does not automatically change the course slide count. The actual visuals must be reviewed before adjusting the published curriculum."
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write("\n".join(summary)+"\n")
          print("\n".join(summary))
          PY

      - name: Archive source inventory for review
        uses: actions/upload-artifact@v4
        with:
          name: aip-module-02-verified-r2-inventory
          path: video-review/aip/module-02-r2-inventory.json
          if-no-files-found: error
          retention-days: 30
