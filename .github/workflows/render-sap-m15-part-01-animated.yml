name: Render SAP Module 15 Part 01 — Animated VisualFirst
on:
  push:
    branches: [main]
    paths:
      - "public/course-visuals/sap-c03/module-15/animated/slide-01-animated.gif"
      - "public/course-visuals/sap-c03/module-15/animated/slide-02-animated.gif"
      - "public/course-visuals/sap-c03/module-15/animated/slide-03-animated.gif"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sap-m15-part-01-animated-visualfirst
  cancel-in-progress: false
jobs:
  render:
    name: SAP M15 P01 — Andrew Neural with approved animated slides
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install VisualFirst narration and media engine
        run: |
          python -m pip install --disable-pip-version-check --retries 3 --timeout 20 "edge-tts>=7,<8" "Pillow>=10,<13" "requests>=2.31,<3" "imageio-ffmpeg>=0.6,<1" "mutagen>=1.47,<2"
          python -m py_compile scripts/render_aip_course_video.py scripts/aip_tts_reliability.py scripts/aip_media_tools.py
      - name: Validate genuinely animated GIFs and create authoritative render manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          from scripts.render_aip_course_video import load_animated_slide
          import tempfile
          source=Path("content/video-narration/sap-module-15-part-01.json")
          m=json.loads(source.read_text(encoding="utf-8"))
          assert (m["course_slug"],m["module_id"],m["part_id"])==("sap","15","01")
          assert [s["slide"] for s in m["scenes"]]==[1,2,3]
          assert m["voice"]=="en-US-AndrewNeural" and m["speech_rate"]=="-3%"
          assert all(len(s["narration"].split())>=95 for s in m["scenes"])
          m["animated_slide_dir"]="public/course-visuals/sap-c03/module-15/animated"
          m["script_revision"]="2026-11-18-sap-m15-p01-animated-visualfirst-v2"
          with tempfile.TemporaryDirectory() as directory:
              for slide in (1,2,3):
                  f,url=load_animated_slide("15",slide,m["animated_slide_dir"],Path(directory),"sap")
                  with Image.open(f) as im:
                      frames=im.n_frames
                      duration_ms=0
                      for i in range(frames):
                          im.seek(i)
                          duration_ms+=max(20,int(im.info.get("duration",100)))
                      print(f"PASS: Slide {slide}: {frames} animated frames, {duration_ms/1000:.2f}s, {im.size}, {url}")
          p=Path("video-output/sap-m15-p01-animated")
          p.mkdir(parents=True,exist_ok=True)
          (p/"render-manifest.json").write_text(json.dumps(m,indent=2)+"\n",encoding="utf-8")
          print("PASS: authoritative source narration, Andrew voice and chronological slide order")
          PY
      - name: Render narrated animation with VisualFirst chapters and subtitles
        env:
          AIP_TTS_MAX_ATTEMPTS: "15"
          AIP_TTS_RETRY_SLEEP_CAP_SECONDS: "30"
        run: |
          python scripts/render_aip_course_video.py --manifest video-output/sap-m15-p01-animated/render-manifest.json --output video-output/sap-m15-p01-animated --width 1920 --height 1080 --fps 30
      - name: Verify chapters, audio, animation sources and output duration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.aip_media_tools import media_seconds
          root=Path("video-output/sap-m15-p01-animated")
          name="sap-module-15-part-01"
          report=json.loads((root/f"{name}-manifest.json").read_text(encoding="utf-8"))
          assert (report["module"],report["part"])==("15","01")
          assert report["script_revision"]=="2026-11-18-sap-m15-p01-animated-visualfirst-v2"
          assert [x["slide"] for x in report["scenes"]]==[1,2,3]
          assert all(x["original_image"].endswith(f'slide-{x["slide"]:02}-animated.gif') for x in report["scenes"])
          assert abs(media_seconds(root/f"{name}.mp4")-report["duration_seconds"])<3.5
          assert (root/f"{name}.vtt").read_text().startswith("WEBVTT")
          assert (root/f"{name}.srt").is_file() and (root/f"{name}-transcript.txt").is_file()
          print("PASS: animated VisualFirst MP4, captions, transcript, chapters and timing")
          PY
      - name: Publish to course R2 preview media location
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" && test -n "$R2_ENDPOINT" && test -n "$R2_BUCKET"
          SRC="video-output/sap-m15-p01-animated"
          STEM="sap-module-15-part-01"
          DEST="s3://$R2_BUCKET/aws-course-videos/previews/sap/module-15/part-01"
          for ext in mp4 vtt srt; do
            aws s3 cp "$SRC/$STEM.$ext" "$DEST/$STEM.$ext" --endpoint-url "$R2_ENDPOINT" --no-progress
          done
          aws s3 cp "$SRC/$STEM-transcript.txt" "$DEST/$STEM-transcript.txt" --endpoint-url "$R2_ENDPOINT" --no-progress
          aws s3 cp "$SRC/$STEM-manifest.json" "$DEST/$STEM-manifest.json" --endpoint-url "$R2_ENDPOINT" --no-progress
          aws s3api head-object --bucket "$R2_BUCKET" --key "aws-course-videos/previews/sap/module-15/part-01/$STEM.mp4" --endpoint-url "$R2_ENDPOINT" >/dev/null
          echo "Published validated animated VisualFirst Part 01."
      - name: Verify public animated revision
        run: |
          python - <<'PY'
          import requests,time
          root="https://pub-a5e11688cacf4195a0d3c6afe384eb56.r2.dev/aws-course-videos/previews/sap/module-15/part-01/sap-module-15-part-01"
          for attempt in range(6):
              try:
                  r=requests.get(root+"-manifest.json",params={"check":str(attempt)},timeout=20)
                  r.raise_for_status()
                  m=r.json()
                  assert m["script_revision"]=="2026-11-18-sap-m15-p01-animated-visualfirst-v2"
                  assert [s["slide"] for s in m["scenes"]]==[1,2,3]
                  v=requests.get(root+".mp4",headers={"Range":"bytes=0-1023"},stream=True,timeout=20)
                  assert v.status_code in (200,206)
                  v.close()
                  print("PASS: publicly accessible animated Part 01 and correct course mapping")
                  break
              except Exception as exc:
                  print(f"Check {attempt+1}/6: {exc}",flush=True)
                  if attempt==5: raise
                  time.sleep(12)
          PY
