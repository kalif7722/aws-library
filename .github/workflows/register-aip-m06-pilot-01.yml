name: Register already-rendered AIP M06 Video 01 pilot
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/register-aip-m06-pilot-01.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aip-m06-pilot-01-register-only
  cancel-in-progress: false
jobs:
  register:
    name: Verify existing R2 pilot and update GitHub record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch existing manifest; verify current narration before registering
        env:
          MANIFEST_URL: https://pub-a5e11688cacf4195a0d3c6afe384eb56.r2.dev/aws-course-videos/previews/aip/module-06/part-01/aip-module-06-part-01-manifest.json
          MP4_URL: https://pub-a5e11688cacf4195a0d3c6afe384eb56.r2.dev/aws-course-videos/previews/aip/module-06/part-01/aip-module-06-part-01.mp4
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          from pathlib import Path
          source=json.loads(Path("content/video-narration/aip-module-06-part-01.json").read_text())
          req=urllib.request.Request(os.environ["MANIFEST_URL"],headers={"Cache-Control":"no-cache"})
          with urllib.request.urlopen(req,timeout=35) as r:
              manifest=json.load(r)
          expected=[s["slide"] for s in source["scenes"]]
          actual=[s.get("slide") for s in manifest.get("scenes",[])]
          assert manifest.get("module")=="06" and manifest.get("part")=="01", "Incorrect video module/part"
          assert actual==expected==[1,2,3,4,5], f"Unexpected slide order: {actual}"
          assert manifest.get("script_revision")==source["script_revision"], (
              f"R2 has revision {manifest.get('script_revision')}; source expects {source['script_revision']}. "
              "This recovery workflow deliberately will not register stale or different narration."
          )
          assert float(manifest.get("duration_seconds",0))>150, "Invalid duration"
          # Verify MP4 exists without fetching the media, using a byte-range request when HEAD is unsupported.
          try:
              with urllib.request.urlopen(urllib.request.Request(os.environ["MP4_URL"],method="HEAD"),timeout=35) as r:
                  assert r.status==200
          except Exception:
              with urllib.request.urlopen(urllib.request.Request(os.environ["MP4_URL"],headers={"Range":"bytes=0-0"}),timeout=35) as r:
                  assert r.status in (200,206)
                  r.read(1)
          Path("pilot-manifest.json").write_text(json.dumps(manifest),encoding="utf-8")
          print("Verified R2 pilot MP4 and manifest:",source["script_revision"],expected)
          PY
      - name: Register existing verified pilot without re-rendering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publish_aip_video_release.py --manifest pilot-manifest.json
