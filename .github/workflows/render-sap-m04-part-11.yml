name: Render SAP Module 04 Part 11 — VisualFirst
on:
  push:
    branches: [main]
    paths:
      - "content/video-narration/sap-module-04-part-11.json"
      - ".github/workflows/render-sap-m04-part-11.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sap-m04-part-11-visualfirst-v1
  cancel-in-progress: false
jobs:
  render:
    name: SAP M04 Part 11 — original visuals
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate SAP original slides and visual-first script
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("content/video-narration/sap-module-04-part-11.json")
          m=json.loads(p.read_text())
          assert (m["course_slug"],m["module_id"],m["part_id"])==("sap","04","11")
          assert m["output_prefix"]=="sap-module-04-part-11"
          assert m["script_revision"]=="2026-11-17-sap-m04-p11-visualfirst-v1"
          assert m["slide_local_dir"]=="public/course-visuals/sap-c03/module-04"
          assert m["voice"]=="en-US-AndrewNeural" and m["speech_rate"]=="-3%"
          assert [s["slide"] for s in m["scenes"]]==[31,32,33,34,35]
          for s in m["scenes"]:
              assert len(s["narration"].split())>=95
              assert s.get("visual_overview") and len(s.get("visual_walkthrough",[]))>=3
              assert s.get("visual_example") and s.get("visual_synthesis")
              f=Path(f'public/course-visuals/sap-c03/module-04/slide-{s["slide"]:02}.webp')
              assert f.is_file() and f.stat().st_size>10000, str(f)
              assert f.open("rb").read(4)==b"RIFF", str(f)
          print("PASS: original SAP slides, VisualFirst narration and revision")
          PY
      - name: Install narration and video engine
        run: |
          python -m pip install --disable-pip-version-check --retries 3 --timeout 20 "edge-tts>=7,<8" "Pillow>=10,<13" "requests>=2.31,<3" "imageio-ffmpeg>=0.6,<1" "mutagen>=1.47,<2"
          python -m py_compile scripts/render_aip_course_video.py scripts/aip_tts_reliability.py scripts/aip_media_tools.py
      - name: Render fresh Andrew voice with synchronized chapters and subtitles
        env:
          AIP_TTS_MAX_ATTEMPTS: "15"
          AIP_TTS_RETRY_SLEEP_CAP_SECONDS: "30"
        run: |
          python scripts/render_aip_course_video.py --manifest content/video-narration/sap-module-04-part-11.json --output video-output/sap-m04-p11 --width 1920 --height 1080 --fps 24
      - name: Verify rendered video before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.aip_media_tools import media_seconds
          root=Path("video-output/sap-m04-p11")
          stem="sap-module-04-part-11"
          m=json.loads((root/f"{stem}-manifest.json").read_text())
          assert (m["module"],m["part"])==("04","11")
          assert m["script_revision"]=="2026-11-17-sap-m04-p11-visualfirst-v1"
          assert [s["slide"] for s in m["scenes"]]==[31,32,33,34,35]
          assert (root/f"{stem}.vtt").read_text().startswith("WEBVTT")
          assert (root/f"{stem}.srt").is_file() and (root/f"{stem}-transcript.txt").is_file()
          assert abs(media_seconds(root/f"{stem}.mp4")-m["duration_seconds"])<3.5
          print("PASS: MP4, chapter sequence, subtitles, transcript and revision")
          PY
      - name: Publish verified media and manifest to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" && test -n "$R2_ENDPOINT" && test -n "$R2_BUCKET"
          SRC="video-output/sap-m04-p11"
          STEM="sap-module-04-part-11"
          DEST="s3://$R2_BUCKET/aws-course-videos/previews/sap/module-04/part-11"
          for ext in mp4 vtt srt; do
            aws s3 cp "$SRC/$STEM.$ext" "$DEST/$STEM.$ext" --endpoint-url "$R2_ENDPOINT" --no-progress
          done
          aws s3 cp "$SRC/$STEM-transcript.txt" "$DEST/$STEM-transcript.txt" --endpoint-url "$R2_ENDPOINT" --no-progress
          aws s3 cp "$SRC/$STEM-manifest.json" "$DEST/$STEM-manifest.json" --endpoint-url "$R2_ENDPOINT" --no-progress
          aws s3api head-object --bucket "$R2_BUCKET" --key "aws-course-videos/previews/sap/module-04/part-11/$STEM.mp4" --endpoint-url "$R2_ENDPOINT" >/dev/null
          aws s3api head-object --bucket "$R2_BUCKET" --key "aws-course-videos/previews/sap/module-04/part-11/$STEM-manifest.json" --endpoint-url "$R2_ENDPOINT" >/dev/null
          echo "Published verified SAP M04 Part 11 media and manifest."
