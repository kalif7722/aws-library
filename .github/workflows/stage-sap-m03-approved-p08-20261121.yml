name: Stage exact approved SAP M03 Part 08 release
on:
  push:
    branches: [stage/sap-m03-approved-p08-20261121]
    paths: [.github/workflows/stage-sap-m03-approved-p08-20261121.yml]
permissions:
  contents: read
concurrency:
  group: sap-m03-approved-p08-20261121
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/stage/sap-m03-approved-p08-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install official SDK
        run: python -m pip install --disable-pip-version-check boto3
