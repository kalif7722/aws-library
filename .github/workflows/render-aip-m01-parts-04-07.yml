name: Render AIP Module 01 remaining lectures (Parts 04–07)

on:
  push:
    branches: [main]
    paths:
      - "content/video-narration/aip-module-01-part-04.json"
      - "content/video-narration/aip-module-01-part-05.json"
      - "content/video-narration/aip-module-01-part-06.json"
      - "content/video-narration/aip-module-01-part-07.json"
      - ".github/workflows/render-aip-m01-parts-04-07.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Part ${{ matrix.part }} — narrated AWS visuals
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - part: "04"
            start: 25
            end: 34
          - part: "05"
            start: 35
            end: 43
          - part: "06"
            start: 44
            end: 54
          - part: "07"
            start: 55
            end: 59

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install video engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "edge-tts>=7,<8" "Pillow>=10,<13" "requests>=2.31,<3"
          python -m py_compile scripts/render_aip_course_video.py scripts/aip_tts_reliability.py scripts/publish_aip_video_release.py

      - name: Validate slide mapping and narration before spending TTS calls
        env:
          PART: ${{ matrix.part }}
          START_SLIDE: ${{ matrix.start }}
          END_SLIDE: ${{ matrix.end }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          part = os.environ["PART"]
          src = Path(f"content/video-narration/aip-module-01-part-{part}.json")
          m = json.loads(src.read_text(encoding="utf-8"))
          expected = list(range(int(os.environ["START_SLIDE"]), int(os.environ["END_SLIDE"])+1))
          assert m["module_id"] == "01" and m["part_id"] == part
          assert [s["slide"] for s in m["scenes"]] == expected
          assert m["script_revision"] == f"2026-11-11-m01-p{part}-visual-aligned-v1"
          assert all(len(s["narration"].strip().split()) > 80 for s in m["scenes"])
          print(f"Part {part}: validated {len(expected)} consecutive original slide references")
          PY

      - name: Restore narration audio from prior attempt
        uses: actions/cache/restore@v4
        with:
          path: video-output/part-${{ matrix.part }}/_work/audio
          key: aip-m01-p${{ matrix.part }}-tts-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aip-m01-p${{ matrix.part }}-tts-v1-

      - name: Render every slide with its own visually aligned lecturer explanation
        run: |
          python scripts/render_aip_course_video.py \
            --manifest content/video-narration/aip-module-01-part-${{ matrix.part }}.json \
            --output video-output/part-${{ matrix.part }} \
            --width 1920 --height 1080 --fps 24

      - name: Preserve valid audio chunks on success or failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: video-output/part-${{ matrix.part }}/_work/audio
          key: aip-m01-p${{ matrix.part }}-tts-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify rendered MP4 and its chapters
        env:
          PART: ${{ matrix.part }}
          START_SLIDE: ${{ matrix.start }}
          END_SLIDE: ${{ matrix.end }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          part = os.environ["PART"]
          stem = f"aip-module-01-part-{part}"
          folder = Path("video-output") / f"part-{part}"
          m = json.loads((folder / (stem+"-manifest.json")).read_text())
          expected = list(range(int(os.environ["START_SLIDE"]), int(os.environ["END_SLIDE"])+1))
          assert m["script_revision"] == f"2026-11-11-m01-p{part}-visual-aligned-v1"
          assert [s["slide"] for s in m["scenes"]] == expected
          assert m["duration_seconds"] > len(expected)*30
          video = folder / (stem+".mp4")
          result = subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1", str(video)], text=True)
          duration = float(result.strip())
          assert abs(duration-m["duration_seconds"]) < 3.5
          assert (folder / (stem+".vtt")).read_text().startswith("WEBVTT")
          print("Verified:", video, round(duration, 2), "seconds,", len(expected), "slide chapters")
          PY

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: aip-module-01-part-${{ matrix.part }}-lecture-preview
          path: |
            video-output/part-${{ matrix.part }}/aip-module-01-part-${{ matrix.part }}.mp4
            video-output/part-${{ matrix.part }}/aip-module-01-part-${{ matrix.part }}.vtt
            video-output/part-${{ matrix.part }}/aip-module-01-part-${{ matrix.part }}.srt
            video-output/part-${{ matrix.part }}/aip-module-01-part-${{ matrix.part }}-transcript.txt
            video-output/part-${{ matrix.part }}/aip-module-01-part-${{ matrix.part }}-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload completed lecture and captions to R2
        id: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PART: ${{ matrix.part }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "Missing R2 credentials: video remains downloadable as a GitHub artifact."
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREFIX="aws-course-videos/previews/aip/module-01/part-$PART"
          STEM="aip-module-01-part-$PART"
          SRC="video-output/part-$PART"
          for ext in mp4 vtt srt txt json; do
            case "$ext" in
              mp4) suffix="$STEM.mp4"; mime="video/mp4";;
              vtt) suffix="$STEM.vtt"; mime="text/vtt";;
              srt) suffix="$STEM.srt"; mime="application/x-subrip";;
              txt) suffix="$STEM-transcript.txt"; mime="text/plain";;
              json) suffix="$STEM-manifest.json"; mime="application/json";;
            esac
            aws s3 cp "$SRC/$suffix" "s3://$R2_BUCKET/$PREFIX/$suffix" \
              --endpoint-url "$R2_ENDPOINT" --content-type "$mime" --no-progress
          done
          aws s3api head-object --bucket "$R2_BUCKET" --key "$PREFIX/$STEM.mp4" \
            --endpoint-url "$R2_ENDPOINT" >/dev/null
          aws s3api head-object --bucket "$R2_BUCKET" --key "$PREFIX/$STEM-manifest.json" \
            --endpoint-url "$R2_ENDPOINT" >/dev/null
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Register the video only after a verified R2 upload
        if: steps.upload.outputs.uploaded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publish_aip_video_release.py \
            --manifest video-output/part-${{ matrix.part }}/aip-module-01-part-${{ matrix.part }}-manifest.json
