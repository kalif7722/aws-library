name: Publish approved SAP Module 15 Part 04
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-sap-m15-p04-approved.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sap-m15-p04-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sap-m15-part04-complete-review
          run-id: 44378467686
          github-token: ${{ github.token }}
          path: approved
      - run: python -m pip install boto3 requests
      - name: Validate approved artifact, publish media, then activate manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,os,re,subprocess
          import boto3,requests
          from botocore.config import Config
          p=Path("approved")
          q=json.loads((p/"review-report.json").read_text())
          video=p/"SAP-Module-15-Part-04-AndrewUS-Complete.mp4"
          assert q["slides"]==[10,11,12] and q["decode_errors"]==0
          assert q["voice"]=="en-US-AndrewNeural"
          assert hashlib.sha256(video.read_bytes()).hexdigest()==q["sha256"]
          assert abs(q["duration_seconds"]-348.729667)<.1
          assert (p/"captions.vtt").read_text().count("-->")==15
          assert all(x["psnr_db"]>35 for x in q["hold_fidelity"])
          stem="sap-module-15-part-04"
          revision="2026-11-19-sap-m15-p04-direct-animation-v2"
          titles=["Origin group failover contract","CloudFront geographic restrictions","Price class and delivery-cost choices"]
          m=dict(module="15",part="04",script_revision=revision,duration_seconds=q["duration_seconds"],voice=q["voice"],speech_rate=q["rate"],resolution="2048x1152",sha256=q["sha256"],status="approved",source_run=44378467686,scenes=[dict(slide=c["slide"],title=titles[i],start_seconds=c["start"],duration_seconds=c["duration"],original_image=f'/course-visuals/sap-c03/module-15/slide-{c["slide"]:02}.webp') for i,c in enumerate(q["chapters"])])
          vtt=(p/"captions.vtt").read_text()
          (p/(stem+".srt")).write_text(re.sub(r"(\d\d:\d\d:\d\d)\.(\d{3})",r"\1,\2",vtt.replace("WEBVTT\n\n","")))
          (p/(stem+"-manifest.json")).write_text(json.dumps(m,indent=2))
          c=boto3.client("s3",endpoint_url=os.environ["R2_ENDPOINT"],region_name="auto",config=Config(signature_version="s3v4"))
          prefix="aws-course-videos/previews/sap/module-15/part-04/"+stem
          items=[(video,".mp4","video/mp4"),(p/"captions.vtt",".vtt","text/vtt"),(p/(stem+".srt"),".srt","application/x-subrip"),(p/"transcript.txt","-transcript.txt","text/plain"),(p/(stem+"-manifest.json"),"-manifest.json","application/json")]
          for f,ext,mime in items:
              c.upload_file(str(f),os.environ["R2_BUCKET"],prefix+ext,ExtraArgs={"ContentType":mime,"CacheControl":"no-cache"})
              print("Published",ext,flush=True)
          root="https://pub-a5e11688cacf4195a0d3c6afe384eb56.r2.dev/"+prefix
          remote=requests.get(root+"-manifest.json",params={"check":revision},timeout=40);remote.raise_for_status()
          assert remote.json()["script_revision"]==revision
          assert [x["slide"] for x in remote.json()["scenes"]]==[10,11,12]
          response=requests.get(root+".mp4",params={"v":revision},timeout=90);response.raise_for_status()
          assert hashlib.sha256(response.content).hexdigest()==q["sha256"]
          for ext in [".vtt",".srt","-transcript.txt"]:
              r=requests.get(root+ext,params={"v":revision},timeout=30);r.raise_for_status()
              assert len(r.content)>100
          print("VERIFIED: public checksum, 348.729667-second approved source, chapters, captions and transcript")
          print("VIDEO_URL="+root+".mp4?v="+revision)
          PY
