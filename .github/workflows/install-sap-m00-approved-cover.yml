name: Install approved SAP M00 cover and queue replacement video
on:
  push:
    branches: [main]
    paths:
      - "public/course-visuals/sap-c03/module-00/approved-cover.webp"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sap-m00-approved-cover-install-v1
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify approved cover and original image set
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=10,<13"
          python scripts/install_sap_module00_cover.py
      - name: Commit cover and shifted image inventory together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/courses/aws-solutions-architect-professional/visual-lesson-map.json \
            content/video-narration/sap-module-00-part-01.json \
            public/course-visuals/sap-c03/module-00/
          git diff --cached --check
          git commit -m "Install approved SAP Module 00 cover as slide 01 and refresh narration for slides 01-05"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Note the rendering trigger
        run: |
          echo "The narration-manifest commit triggers render-sap-m00-part-01.yml."
          echo "The rendering workflow verifies all five slides and uploads a replacement MP4 and matching manifest to R2."
