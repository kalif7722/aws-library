name: Verify uploaded SAP M00–08 exact objects
on:
  push:
    branches: ['review/verify-sap-m00-m08-upload-20261123']
    paths: ['.github/workflows/verify-sap-m00-m08-upload-20261123.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/review/verify-sap-m00-m08-upload-20261123' && github.repository == 'kalif7722/aws-library'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check boto3
      - name: Read only exact approved storage and public objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python - <<'PY'
          import os, json, hashlib, re, urllib.parse, urllib.request, urllib.error, concurrent.futures
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError
          b=open('verification/pins.json','rb').read()
          assert hashlib.sha256(b).hexdigest()=='39e6522e55c3682cd3e6c1aae0eb0139a43824a70953769aa252c7367658961a'
          p=json.loads(b)['parts']; assert len(p)==len({a['part'] for a in p})==49
          hold={'M06P04','M06P07','M06P09','M06P10'}
          for a in p:
           m=re.fullmatch(r'M(0[0-8])P([0-9]{2})',a['part'])
           assert m and a['part'] not in hold and a['revision']=='2026-11-23-sap-through-m08-v1'
           x,z=m.groups(); base=f'aws-course-videos/previews/sap/module-{x}/releases/{a["revision"]}/part-{z}/sap-module-{x}-part-{z}'
           for i,ext in enumerate(('.mp4','.vtt','.srt','-transcript.txt','-manifest.json')): assert a['objects'][i]['key']==base+ext
          endpoint=os.environ['R2_ENDPOINT']; u=urllib.parse.urlsplit(endpoint)
          assert u.scheme=='https' and re.fullmatch(r'[a-z0-9-]+(?:\.[a-z0-9-]+)*\.r2\.cloudflarestorage\.com',u.hostname or '') and u.netloc==u.hostname and u.path in ('','/') and not u.query and not u.fragment
          bucket=os.environ['R2_BUCKET'];api=boto3.client('s3',endpoint_url=endpoint,region_name='auto',config=Config(signature_version='s3v4',connect_timeout=8,read_timeout=25,max_pool_connections=12,retries={'total_max_attempts':1},s3={'addressing_style':'path'}))
          origin='https://pub-a5e11688cacf4195a0d3c6afe384eb56.r2.dev/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*a,**k):return None
          def verify(pair):
           a,o=pair; row={'part':a['part'],'object':o['key'].split('/')[-1]}
           try:
            q=api.head_object(Bucket=bucket,Key=o['key'])
            row['stored_bytes']=q['ContentLength'];row['stored_mime']=q['ContentType']
            res=api.get_object(Bucket=bucket,Key=o['key']); h=hashlib.sha256();n=0; coll=[]
            with res['Body'] as body:
             for c in body.iter_chunks(chunk_size=1024*1024):
              n+=len(c);h.update(c)
              if o['key'].endswith('-manifest.json') and n<1000000: coll.append(c)
            row['exact']=n==o['bytes']==q['ContentLength'] and h.hexdigest()==o['sha256']
            if o['key'].endswith('-manifest.json'):
             m=json.loads(b''.join(coll)); s=m['scenes']; assert m['module']==a['part'][1:3] and m['part']==a['part'][4:] and m['script_revision']==a['revision']
             assert m['media_sha256']==a['objects'][0]['sha256'] and 0<m['duration_seconds'] and len(s)==a['chapters']
             assert all(0<=x['start_seconds']<m['duration_seconds'] and x['duration_seconds']>0 and x['duration_seconds']+x['start_seconds']<=m['duration_seconds']+.03 for x in s)
             assert all(x['start_seconds']<=z['start_seconds'] for x,z in zip(s,s[1:]))
             row['manifest_ok']=True
           except ClientError as e:
            stat=e.response.get('ResponseMetadata',{}).get('HTTPStatusCode')
            row.update(exact=False,storage='missing' if stat==404 else 'http_error')
           except Exception:
            row.setdefault('exact',False);row['storage']='validation_or_connect_error'
           try:
            op=urllib.request.build_opener(NoRedirect()); url=origin+o['key']; isvid=o['mime']=='video/mp4'
            req=urllib.request.Request(url,headers={'Range':'bytes=0-1023'} if isvid else {},method='GET' if isvid else 'HEAD')
            with op.open(req,timeout=12) as rr:
             row['public']=rr.status;row['public_mime']=rr.headers.get_content_type()
             if isvid:row['range_ok']=rr.status==206 and rr.headers.get('Content-Range')==f"bytes 0-1023/{o['bytes']}" and len(rr.read(1025))==1024
             else:row['public_size_ok']=rr.headers.get('Content-Length')==str(o['bytes'])
           except urllib.error.HTTPError as e:row['public']=e.code
           except Exception:row['public']='connect_error'
           return row
          ordered=[(a,o) for a in p for o in a['objects']]; assert len(ordered)==245
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
           result=list(pool.map(verify,ordered))
          report={'objects':len(result),'exact':sum(r['exact'] for r in result),'manifest_ok':sum(r.get('manifest_ok',False) for r in result),'public':sum(r.get('public') in (200,206) for r in result),'rows':result}
          json.dump(report,open('readback.json','w'),indent=2)
          print(json.dumps({k:v for k,v in report.items() if k!='rows'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sap-m00-m08-readback
          path: readback.json
          retention-days: 3
          if-no-files-found: error
