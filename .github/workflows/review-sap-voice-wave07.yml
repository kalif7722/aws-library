name: SAP wave 07 Andrew narration review
on:
  push:
    branches: [review/sap-voice-wave07]
    paths: [.github/workflows/review-sap-voice-wave07.yml, scripts/review_sap_voice_wave07.py, content/video-narration/review-sap-voice-wave07.json, content/video-narration/review-sap-voice-wave07.sha256]
permissions:
  contents: read
concurrency:
  group: sap-voice-wave07-review-only
  cancel-in-progress: false
jobs:
  voice:
    if: github.event_name == 'push' && github.ref == 'refs/heads/review/sap-voice-wave07'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: [m06p03, m06p04, m06p05, m06p06, m06p07]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/review_sap_voice_wave07.py
            content/video-narration/review-sap-voice-wave07.json
            content/video-narration/review-sap-voice-wave07.sha256
          sparse-checkout-cone-mode: false
      - name: Verify exact inputs before any third-party work
        run: python3 scripts/review_sap_voice_wave07.py validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install established audio tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --disable-pip-version-check 'edge-tts==7.3.1'
      - name: Narrate exact review cues
        env:
          REVIEW_PART: ${{ matrix.part }}
        run: python scripts/review_sap_voice_wave07.py synthesize "$REVIEW_PART"
      - uses: actions/upload-artifact@v4
        with:
          name: sap-wave07-${{ matrix.part }}-andrew-review
          path: voice-review/${{ matrix.part }}/
          retention-days: 3
          if-no-files-found: error
