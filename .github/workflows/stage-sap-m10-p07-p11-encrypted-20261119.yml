              for x in items:
                  try:
                      api.head_object(Bucket=bucket,Key=x["key"])
                  except ClientError as e:
                      if str(e.response["Error"]["Code"]) not in ("404","NoSuchKey","NotFound"):
                          raise RuntimeError() from None
                  else:
                      raise RuntimeError() # version exists; no envelope issued
              if "IfNoneMatch" not in api.meta.service_model.operation_model("PutObject").input_shape.members:
                  raise RuntimeError() # do not sign an unconditional operation
              issued=int(time.time())
              for x in items:
                  params={"Bucket":bucket,"Key":x["key"]}
                  x["put_url"]=api.generate_presigned_url("put_object",
                      Params={**params,"ContentType":x["content_type"],"Metadata":{"sha256":x["sha256"]},"IfNoneMatch":"*"},
                      ExpiresIn=900,HttpMethod="PUT")
                  x["get_url"]=api.generate_presigned_url("get_object",Params=params,ExpiresIn=900,HttpMethod="GET")
              payload=json.dumps({"revision":"2026-11-19-topic-led-p07-p11-v1","inventory_sha256":"af0f7cc57bc089ed8e37c10b5363f9b0cd58e4678be230dcf5f7821d9d73ccc6",
                  "issued_at":issued,"expires_at":issued+900,"endpoint_host":u.hostname,"bucket":bucket,"objects":items}).encode()
              os.makedirs("encrypted",exist_ok=True)
              r=subprocess.run(["openssl","cms","-encrypt","-binary","-aes-256-cbc","-outform","DER",
                  "-out","encrypted/targets.cms","recipient.crt"],input=payload,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if r.returncode: raise RuntimeError()
              print("Prepared encrypted create-only handoff for 25 exact objects.")
          except Exception:
              print("No handoff: existence, configuration, or encryption check failed. No details logged.",file=sys.stderr)
              sys.exit(1)
