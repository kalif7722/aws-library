name: AWS simulator validation

on:
  push:
    branches:
      - feature/troubleshooting-guided-flow
      - feature/visual-troubleshooting-labs
      - feature/aws-top-20-console-labs
    paths:
      - "app/troubleshooting/simulators/aws/**"
      - "app/troubleshooting/labs/**"
      - "app/troubleshooting/page.tsx"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-verified.sh"
      - ".github/workflows/aws-simulator-validation.yml"

permissions:
  contents: read

concurrency:
  group: aws-simulator-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Production build and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and run the complete regression suite
        env:
          SITES_BUILD_TIMEOUT: "6m"
          SITES_BUILD_KILL_AFTER: "15s"
        run: npm test
