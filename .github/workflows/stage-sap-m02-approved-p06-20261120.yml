name: Stage exact approved SAP M02 Part 06 release
on:
  push:
    branches: [stage/sap-m02-approved-p06-20261120]
    paths: [.github/workflows/stage-sap-m02-approved-p06-20261120.yml]
permissions:
  contents: read
concurrency:
  group: sap-m02-approved-p06-20261120
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/stage/sap-m02-approved-p06-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install official SDK
        run: python -m pip install --disable-pip-version-check boto3
      - name: Write public encryption recipient
        run: |
          cat > recipient.crt <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEGTCCAoGgAwIBAgIUK/bTUojThSRelgMAkQUbOmw8jkIwDQYJKoZIhvcNAQEL
