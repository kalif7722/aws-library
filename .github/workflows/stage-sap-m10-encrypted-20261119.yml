                  else: raise RuntimeError('Version object already exists; refusing overwrite')
              for x in items:
                  p={'Bucket':os.environ['R2_BUCKET'],'Key':x['key']}
                  x['put_url']=c.generate_presigned_url('put_object',Params={**p,'ContentType':x['content_type'],'Metadata':{'sha256':x['sha256']}},ExpiresIn=900,HttpMethod='PUT')
                  x['get_url']=c.generate_presigned_url('get_object',Params=p,ExpiresIn=900,HttpMethod='GET')
              payload=json.dumps({'expires_at':int(time.time())+900,'objects':items}).encode()
              os.makedirs('encrypted',exist_ok=True)
              r=subprocess.run(['openssl','cms','-encrypt','-binary','-aes-256-cbc','-outform','DER','-out','encrypted/targets.cms','recipient.crt'],input=payload,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
