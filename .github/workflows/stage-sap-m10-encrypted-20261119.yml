ule-10/releases/2026-11-19-topic-led-p03-p06-v2/part-06/sap-module-10-part-06-transcript.txt', 'sha256': 'be1e7138ccfd0feb021d4513402b03dc485ad7877435bd47a52a25935f4bab20', 'size': 4871, 'content_type': 'text/plain'}, {'key': 'aws-course-videos/previews/sap/module-10/releases/2026-11-19-topic-led-p03-p06-v2/part-06/sap-module-10-part-06-manifest.json', 'sha256': 'ffcc4495e60527095d26c79e5b8cb482cfb859eeefd5482b0b2bd1b605d77bff', 'size': 2259, 'content_type': 'application/json'}]
              for x in items:
